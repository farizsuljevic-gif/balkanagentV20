<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order — BalkanAgent</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"></head><body><header class="site-header"><a class="brand" href="index.html"><span class="brand-mark">BA</span><strong>BALKAN<span>AGENT</span></strong></a></header><main><section class="section" style="max-width:760px"><span class="eyebrow">REQUEST A PLAN</span><h1 id="title">Choose your BalkanAgent plan.</h1><form id="orderForm"><input name="name" placeholder="Full name" required><input name="business" placeholder="Business name" required><input name="phone" placeholder="Phone / WhatsApp" required><textarea name="details" placeholder="What should your AI employee do?"></textarea><button class="btn">Send request on WhatsApp</button></form><script>const q=new URLSearchParams(location.search),p=q.get("plan")||"Custom",pr=q.get("price")||"";document.getElementById("title").textContent=`${p} ${pr?("— €"+pr+"/month"):""}`;document.getElementById("orderForm").onsubmit=e=>{e.preventDefault();const f=new FormData(e.target);window.open(`https://wa.me/4917622824031?text=${encodeURIComponent("BalkanAgent plan request\nPlan: "+p+"\nName: "+f.get("name")+"\nBusiness: "+f.get("business")+"\nPhone: "+f.get("phone")+"\nDetails: "+f.get("details"))}`,"_blank")}</script></section></main></body></html>
