<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Plan & Payment — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><div class="app"><aside class="side" id="side"><img src="logo.png" alt="BalkanAgent"><a href="dashboard.html" class="" data-i18n="dashboard">Dashboard</a><a href="bots.html" class="" data-i18n="bots">Bots</a><a href="leads.html" class="" data-i18n="leads">Leads</a><a href="billing.html" class="active" data-i18n="billing">Billing</a><a href="profile.html" class="" data-i18n="profile">Profile</a><a href="index.html">Public website</a><a href="#" id="logoutSide" data-i18n="logout">Log out</a></aside><main class="content"><header class="top"><div><button class="mobileapp btn" id="mobileMenu">☰</button><h1>Plan & Payment</h1><p class="muted" id="welcome"></p></div><div><select data-lang-select><option value="me">🇲🇪 Crnogorski</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="ru">🇷🇺 Русский</option><option value="sq">🇦🇱 Shqip</option><option value="sl">🇸🇮 Slovenščina</option><option value="mk">🇲🇰 Македонски</option><option value="bg">🇧🇬 Български</option><option value="el">🇬🇷 Ελληνικά</option><option value="ro">🇷🇴 Română</option><option value="tr">🇹🇷 Türkçe</option></select> <button class="btn primary" id="logout" data-i18n="logout">Log out</button></div></header><section class="prices"><article class="card price"><h3>Starter</h3><strong>€49</strong><button class="btn plan" data-plan="Starter">Request Starter</button></article><article class="card price popular"><span class="tag">POPULAR</span><h3>Business</h3><strong>€99</strong><button class="btn primary plan" data-plan="Business">Request Business</button></article><article class="card price"><h3>Pro</h3><strong>€199</strong><button class="btn plan" data-plan="Pro">Request Pro</button></article><article class="card price"><h3>Enterprise</h3><strong>Custom</strong><button class="btn gold plan" data-plan="Enterprise">Request Enterprise</button></article></section><section class="panel" style="margin-top:13px"><h2>Bank transfer</h2><p class="muted">IBAN and bank details will be added before paid activation. You can already request a package; the admin will see your request.</p><div id="notice" class="notice"></div></section></main></div><script>(async()=>{try{const auth=await BA.requireUser(false);if(!auth)return;window.currentAuth=auth;welcome.textContent=(auth.profile.full_name||auth.profile.email)+' · '+(auth.profile.company_name||'BalkanAgent');logout.onclick=BA.signout;logoutSide.onclick=e=>{e.preventDefault();BA.signout()};mobileMenu.onclick=()=>side.classList.toggle('open');document.querySelectorAll('.plan').forEach(b=>b.onclick=async()=>{try{await BA.requestPlan(b.dataset.plan);BA.notice('Package request sent to admin.',true)}catch(x){BA.notice(x.message)}});}catch(x){alert(x.message);console.error(x)}})();</script></body></html>
