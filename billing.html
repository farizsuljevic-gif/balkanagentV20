<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Billing — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><div class="app"><div id="side"></div><main class="main"><div class="eyebrow">SUBSCRIPTION & INVOICES</div><h1 data-i18n="billing">Billing</h1><div id="notice" class="notice"></div><p><span data-i18n="currentPlan">Current plan</span>: <strong id="current">—</strong></p><div id="plans" class="grid"></div><section class="section"><h2 data-i18n="invoices">Invoices</h2><div id="invoiceList" class="card"></div></section></main></div><script src="/app.js"></script><script>side.innerHTML=BA.sidebar('billing');const labels={starter:'Starter',growth:'Growth',business:'Business',enterprise:'Enterprise'};(async()=>{const u=await BA.requireUser();if(u.is_admin)adminLink.hidden=false;current.textContent=labels[u.plan]||u.plan;const [p,i]=await Promise.all([BA.api('/api/billing/plans'),BA.api('/api/billing/invoices')]);plans.innerHTML=p.plans.map(x=>`<article class="card plan-card ${x.id==='enterprise'?'enterprise':''}">${x.id==='enterprise'?'<div class="badge">ENTERPRISE</div>':''}<h3>${x.name}</h3><div class="price">€${x.price}<small>/mo</small></div><p>${x.id==='starter'?'1 AI employee · Website chat':x.id==='growth'?'3 AI employees · Leads & bookings':x.id==='business'?'10 AI employees · Automations · Team access':'Unlimited scale · Priority onboarding · Enterprise support'}</p><button class="btn choose" data-plan="${x.id}">${BA.D[BA.lang()]?.subscribe||'Choose plan'}</button></article>`).join('');document.querySelectorAll('.choose').forEach(b=>b.onclick=async()=>{b.disabled=true;try{const r=await BA.api('/api/billing/checkout',{method:'POST',body:JSON.stringify({plan:b.dataset.plan})});location.href=r.url}catch(e){BA.msg(e.message);b.disabled=false}});invoiceList.innerHTML=i.items.length?`<table class="invoice-table"><thead><tr><th>#</th><th>Date</th><th>Plan</th><th>Amount</th><th></th></tr></thead><tbody>${i.items.map(x=>`<tr><td>${x.invoice_number}</td><td>${x.issued_at.slice(0,10)}</td><td>${labels[x.plan]||x.plan}</td><td>€${(x.amount_cents/100).toFixed(2)}</td><td><a class="btn ghost" href="/api/billing/invoices/${x.id}/pdf">PDF</a></td></tr>`).join('')}</tbody></table>`:`<p class="muted">${BA.D[BA.lang()]?.noInvoices||'No invoices yet.'}</p>`;const q=new URLSearchParams(location.search);if(q.has('success'))BA.msg('Subscription activated. Your invoice will appear after Stripe confirms payment.','success');if(q.has('cancel'))BA.msg('Checkout was canceled.')})()</script></body></html>
