<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><main class="shell"><section class="auth card"><div class="eyebrow">BALKANAGENT V3 ENTERPRISE</div><h1 data-i18n="login">Log in</h1><div id="notice" class="notice"></div><form id="form" class="form"><input class="input" type="email" name="email" data-i18n-placeholder="email" placeholder="Email" required autocomplete="email"><input class="input" type="password" name="password" data-i18n-placeholder="password" placeholder="Password" required autocomplete="current-password"><button class="btn" data-i18n="login">Log in</button></form><p class="muted">No account? <a href="/register.html" data-i18n="register">Create account</a></p></section></main><script src="/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{const r=await BA.api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});location.href=r.is_admin?'/admin.html':'/dashboard.html'}catch(x){BA.msg(x.message)}}</script></body></html>
