<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="app.js"></script></head><body><main class="auth-page"><section class="auth-box glass"><a href="index.html"><img src="balkanagent-logo.jpg" alt="BalkanAgent"></a><h1>Prijava</h1><p class="muted">Prijavite se na svoj BalkanAgent nalog.</p><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Lozinka</label><input id="password" type="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Prijavi se →</button></form><div id="notice" class="notice"></div><p class="muted">Nemaš nalog? <a href="register.html">Registruj se</a></p></section></main><script>loginForm.onsubmit=e=>{e.preventDefault();try{const u=BA.login(email.value,password.value);location.href=u.role==="admin"?"admin.html":"dashboard.html"}catch(err){BA.notice(err.message)}};</script></body></html>
