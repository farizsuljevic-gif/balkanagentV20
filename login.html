<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prijava — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="auth"><section class="box"><a class="wordmark" href="index.html"><span>BALKAN</span><strong>AGENT</strong><small>AI AUTOMATION FOR THE BALKANS</small></a><h1>Prijava</h1><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Lozinka</label><input id="password" type="password" required></div><button class="button primary" style="width:100%;margin-top:12px">Prijavi se</button></form><p><a href="forgot-password.html">Zaboravljena lozinka?</a></p><p><a href="register.html">Nemate nalog? Registrujte se</a></p><div id="notice" class="notice"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{const d=await BA.signIn(email.value.trim(),password.value);const p=await BA.getProfile(d.user.id);location.href=p.role==='admin'?'admin.html':'dashboard.html'}catch(x){BA.notice(x.message)}};</script></body></html>
