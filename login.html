<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Welcome back — BalkanAgent</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/styles.css"></head><body><main class="auth-wrap"><div class="auth-card card"><div class="auth-logo"><a href="/"><img src="/logo.svg"></a><h2>Welcome back</h2><p class="muted">BalkanAgent AI Automation Platform</p></div><div id="notice" class="notice"></div><form id="authForm" class="form"><input class="input" type="email" name="email" placeholder="Email" required><input class="input" type="password" name="password" placeholder="Password" minlength="10" required><button class="btn">Log in</button></form><p class="muted" style="text-align:center">New to BalkanAgent? <a href="/register.html">Create account</a></p></div></main><script src="/app.js"></script><script>authForm.onsubmit=async e=>{e.preventDefault();const b=authForm.querySelector("button");b.disabled=true;b.textContent="Please wait…";try{await BA.api("/api/auth/login",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(authForm)))});location.href="/dashboard.html"}catch(err){BA.msg(err.message);b.disabled=false;b.textContent="Log in"}};</script></body></html>
