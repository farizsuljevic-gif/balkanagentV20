<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — BalkanAgent</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span>BALKANAGENT</a></header><main class="shell"><section class="auth card"><div class="eyebrow">WELCOME BACK</div><h1>Log in</h1><div id="notice" class="notice"></div><form id="form" class="form"><input class="input" type="email" name="email" placeholder="Email" required><input class="input" type="password" name="password" placeholder="Password" required><button class="btn">Log in</button></form><p class="muted">No account? <a href="/register.html">Create one</a></p></section></main><script src="/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await BA.api('/api/auth/login',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form))) });location.href='/dashboard.html'}catch(x){BA.msg(x.message)}}</script></body></html>
