<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Log in — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="auth"><section class="authbox glass"><a href="index.html"><img src="logo.png" alt="BalkanAgent"></a><h1>Log in</h1><p class="muted">Access your dashboard.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%;margin-top:12px">Log in</button></form><p class="muted"><a href="forgot-password.html">Forgot password?</a></p><p class="muted">No account? <a href="register.html">Register</a></p><div id="notice" class="notice"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{const d=await BA.signin(email.value.trim(),password.value);const p=await BA.profile(d.user.id);location.href=p.role==='admin'?'admin.html':'dashboard.html'}catch(x){BA.notice(x.message)}};</script></body></html>
