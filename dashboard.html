<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Overview — BalkanAgent</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><img src="/logo.svg"><div><b><span>BALKAN</span><span>AGENT</span></b><small>CONTROL CENTRE</small></div></a><nav class="side-nav">
<a data-page="dashboard" href="/dashboard.html">◫ Overview</a><a data-page="conversations" href="/conversations.html">◉ Conversations</a><a data-page="bookings" href="/bookings.html">◇ Bookings</a><a data-page="agents" href="/agents.html">✦ AI Employees</a><a data-page="profile" href="/profile.html">◌ Company profile</a><a data-page="billing" href="/billing.html">◈ Billing</a><a data-admin data-page="admin" href="/admin.html">⚙ Admin</a></nav><div class="side-bottom"><button class="btn ghost" style="width:100%" id="logoutBtn">Log out</button></div></aside><main class="main"><div class="topbar"><div><button class="btn ghost sm mobile-toggle" onclick="BA.toggleMenu()">☰</button><div class="eyebrow">BALKANAGENT</div><h2>Overview</h2></div><div style="display:flex;align-items:center;gap:12px"><span id="userName" class="hide-mobile muted"></span><div class="avatar" id="avatar">BA</div></div></div><div id="notice" class="notice"></div><section class="stats" id="stats"></section><section class="dashboard-grid"><article class="card"><h3>Conversations this week</h3><div class="chart" id="chart"></div></article><article class="card"><h3>Top channels</h3><div class="list"><div class="row"><span>WhatsApp</span><strong>45%</strong></div><div class="row"><span>Instagram</span><strong>25%</strong></div><div class="row"><span>Website</span><strong>20%</strong></div><div class="row"><span>Messenger</span><strong>10%</strong></div></div></article></section><section class="section" style="padding-bottom:0"><div class="topbar"><div><h3>Recent conversations</h3><p class="muted">Latest customer activity.</p></div><a class="btn ghost sm" href="/conversations.html">View all</a></div><div class="list" id="recent"></div></section></main></div><script src="/app.js"></script><script>
(async()=>{const user=await BA.requireUser(false);if(!user)return;document.querySelector('[data-page="dashboard"]')?.classList.add("active");document.querySelectorAll("[data-admin]").forEach(x=>x.style.display=user.is_admin?"block":"none");userName.textContent=user.full_name||user.email;avatar.textContent=(user.full_name||"BA").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();logoutBtn.onclick=async()=>{await BA.api("/api/auth/logout",{method:"POST"});location.href="/login.html"};const d=await BA.api("/api/dashboard");const cards=[["Conversations",d.conversations],["Bookings",d.bookings],["Leads",d.leads],["Revenue",BA.money(d.revenue)]];stats.innerHTML=cards.map(x=>`<article class="card stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong><span class="trend">▲ this month</span></article>`).join("");const vals=d.weekly?.length?d.weekly:[12,24,18,40,55,36,61];chart.innerHTML=vals.map((v,i)=>`<div class="bar" style="height:${Math.max(12,v)}%"><span>${["M","T","W","T","F","S","S"][i]}</span></div>`).join("");recent.innerHTML=(d.recent||[]).map(x=>`<div class="row"><div><strong>${BA.escape(x.channel)}</strong><div class="muted">${BA.escape(x.customer_name||"Customer")} · ${BA.escape(x.last_message||"New message")}</div></div><span class="pill active">${BA.escape(x.status)}</span></div>`).join("")||`<div class="card muted">No conversations yet.</div>`;})().catch(e=>BA.msg(e.message));
</script><script src="/translate.js"></script></body></html>
