<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Dashboard</title><link rel='stylesheet' href='styles.css'><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body><section class='dashboard'><img src='logo.png' style='width:260px'><h1>Dashboard</h1><p id='welcome'></p><img src='reference-layout.jpg' style='width:100%;border-radius:14px'><p><button class='btn' id='logout'>Log Out</button></p></section><script>(async()=>{const a=await BA.requireUser();if(!a)return;welcome.textContent='Welcome, '+(a.profile.full_name||a.profile.email);logout.onclick=BA.signOut})()</script></body></html>
