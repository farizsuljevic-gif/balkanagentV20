<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><div class="app"><div id="side"></div><main class="main"><div class="topbar"><div><div class="eyebrow">BALKANAGENT V3</div><h1 id="hello" data-i18n="dashboardTitle">Enterprise workspace</h1></div><button id="logout" class="btn ghost" data-i18n="logout">Log out</button></div><section class="stats"><article class="card stat"><span data-i18n="agents">AI Employees</span><strong id="agentsCount">0</strong></article><article class="card stat"><span data-i18n="conversations">Conversations</span><strong id="convCount">0</strong></article><article class="card stat"><span data-i18n="bookings">Bookings</span><strong id="bookingCount">0</strong></article><article class="card stat"><span data-i18n="plan">Plan</span><strong id="plan">—</strong></article></section><section class="section"><div class="card"><h2 data-i18n="workspaceReady">Your BalkanAgent V3 Enterprise workspace is ready.</h2><p class="muted">Manage multilingual AI employees, conversations, bookings, company details, subscriptions and invoices from one secure workspace.</p></div></section></main></div><script src="/app.js"></script><script>side.innerHTML=BA.sidebar('overview');(async()=>{const u=await BA.requireUser();hello.textContent=(BA.D[BA.lang()]?.welcome||'Welcome')+', '+u.full_name;plan.textContent=u.plan;if(u.is_admin){adminLink.hidden=false}const [a,c,b]=await Promise.all([BA.api('/api/agents'),BA.api('/api/conversations'),BA.api('/api/bookings')]);agentsCount.textContent=a.items.length;convCount.textContent=c.items.length;bookingCount.textContent=b.items.length})();logout.onclick=async()=>{await BA.api('/api/auth/logout',{method:'POST'});location.href='/'}</script></body></html>
