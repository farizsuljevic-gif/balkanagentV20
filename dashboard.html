<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dashboard</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="app"><section class="panel glass"><img src="logo.png" style="width:240px"><h1>Dashboard</h1><p id="welcome"></p><p>This is the secure Phase 1 dashboard. Bot Builder and admin tools are added in Phase 2.</p><button class="btn primary" id="logout">Log Out</button></section></main><script>(async()=>{try{const a=await BA.requireUser();if(!a)return;welcome.textContent='Welcome, '+(a.profile.full_name||a.profile.email);logout.onclick=BA.signOut}catch(x){alert(x.message)}})();</script></body></html>
