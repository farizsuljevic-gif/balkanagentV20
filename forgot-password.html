<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Password — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="auth"><section class="authbox glass"><a href="index.html"><img src="logo.png" alt="BalkanAgent"></a><h1>Reset Password</h1><p class="muted">We will send a secure reset link.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required></div><button class="btn primary" style="width:100%;margin-top:12px">Send Reset Link</button></form><div id="notice" class="notice"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{await BA.reset(email.value.trim());BA.notice('Reset link sent.',true)}catch(x){BA.notice(x.message)}};</script></body></html>
