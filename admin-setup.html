<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin setup — BalkanAgent</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span>BALKANAGENT</a></header><main class="shell"><section class="auth card"><div class="eyebrow">ONE-TIME ADMIN SETUP</div><h1>Create or repair administrator access</h1><div id="notice" class="notice"></div><form id="form" class="form"><input class="input" name="fullName" value="Fariz Suljevic" placeholder="Full name" required><input class="input" type="email" name="email" value="fariz.suljevic@gmail.com" placeholder="Admin email" required><input class="input" type="password" name="password" minlength="10" placeholder="New admin password" required><input class="input" type="password" name="setupKey" placeholder="ADMIN_SETUP_KEY from Cloudflare" required><button class="btn">Create / repair admin</button></form><p class="muted">Use this page only once. After successful setup, remove or rotate ADMIN_SETUP_KEY in Cloudflare.</p></section></main><script src="/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{const r=await BA.api('/api/auth/admin-setup',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});location.href='/admin.html'}catch(x){BA.msg(x.message)}}</script></body></html>
