<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><div class="app-layout"><aside class="sidebar"><div class="brand">BALKAN<strong>AGENT</strong></div><a href="admin.html" class="active" data-i18n="admin">Admin panel</a><a href="index.html">Javni sajt</a><a href="#" id="logoutSide" data-i18n="logout">Odjava</a></aside><main class="app-content"><header class="topbar"><div><h1>Admin panel</h1><p id="welcome" style="color:#a8b2c2"></p></div><div><select class="language-select" data-lang><option value="me">🇲🇪 Crnogorski</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="ru">🇷🇺 Русский</option></select> <button class="button primary" id="logout" data-i18n="logout">Odjava</button></div></header><section class="metrics4"><article class="metric-card"><span>Korisnici</span><b id="count">0</b></article><article class="metric-card"><span>Trial</span><b id="trial">0</b></article><article class="metric-card"><span>Aktivni</span><b id="active">0</b></article><article class="metric-card"><span>Admini</span><b id="admins">0</b></article></section><section class="app-card" style="margin-top:14px"><h2>Korisnici</h2><div class="table-wrap"><table><thead><tr><th>Ime</th><th>Email</th><th>Firma</th><th>Paket</th><th>Status</th><th>Uloga</th></tr></thead><tbody id="rows"></tbody></table></div><div id="notice" class="notice"></div></section></main></div><script>(async()=>{try{const auth=await BA.requireUser(true);if(!auth)return;welcome.textContent=(auth.profile.full_name||auth.profile.email)+' · '+(auth.profile.company_name||'BalkanAgent');logout.onclick=BA.signOut;logoutSide.onclick=e=>{e.preventDefault();BA.signOut()};async function render(){const list=await BA.adminUsers();count.textContent=list.length;trial.textContent=list.filter(x=>x.status==='trial').length;active.textContent=list.filter(x=>x.status==='active').length;admins.textContent=list.filter(x=>x.role==='admin').length;rows.innerHTML=list.map(x=>`<tr><td>${BA.esc(x.full_name||'')}</td><td>${BA.esc(x.email)}</td><td>${BA.esc(x.company_name||'')}</td><td><select data-id="${x.id}" data-field="plan">${['Starter','Business','Pro','Enterprise'].map(v=>`<option ${x.plan===v?'selected':''}>${v}</option>`).join('')}</select></td><td><select data-id="${x.id}" data-field="status">${['trial','active','suspended'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td>${BA.esc(x.role)}</td></tr>`).join('');document.querySelectorAll('[data-id]').forEach(s=>s.onchange=async()=>{try{await BA.adminUpdateUser(s.dataset.id,{[s.dataset.field]:s.value});BA.notice('Korisnik je ažuriran.',true)}catch(x){BA.notice(x.message)}})}render();}catch(x){alert(x.message);console.error(x)}})();</script></body></html>
