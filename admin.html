<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-app.js"></script></head><body><div class="app-layout"><aside class="sidebar" id="sidebar"><img src="balkanagent-logo.jpg" alt="BalkanAgent"><a href="admin.html" class="active">Admin pregled</a><a href="dashboard.html">Korisnički pregled</a><a href="index.html">Javni sajt</a><a href="#" id="logoutSide">Odjava</a></aside><main class="app-content"><header class="app-topbar"><div><button class="mobile-app-menu btn btn-secondary" id="mobileMenu">☰</button><h1>Admin panel</h1><p class="muted" id="welcome"></p></div><div><a class="btn btn-secondary" href="index.html">Javni sajt</a> <button class="btn btn-primary" id="logout">Odjava</button></div></header><section class="metrics"><article class="metric"><span>Korisnici</span><b id="cu">0</b></article><article class="metric"><span>Demo zahtjevi</span><b id="cd">0</b></article><article class="metric"><span>Newsletter</span><b id="cn">0</b></article><article class="metric"><span>Admin</span><b>Aktivan</b></article></section><section class="app-panel"><h2>Registrovani korisnici</h2><div class="table-wrap"><table><thead><tr><th>Ime</th><th>Email</th><th>Firma</th><th>Paket</th><th>Status</th><th>Uloga</th></tr></thead><tbody id="ur"></tbody></table></div><div id="notice" class="notice"></div></section><section class="app-panel" style="margin-top:13px"><h2>Demo zahtjevi</h2><div class="table-wrap"><table><thead><tr><th>Ime</th><th>Email</th><th>Firma</th><th>Poruka</th><th>Status</th></tr></thead><tbody id="dr"></tbody></table></div></section></main></div><script>(async()=>{try{const a=await BA.requireUser(true);if(!a)return;const user=a.profile;welcome.textContent=(user.full_name||user.email)+" · "+(user.company_name||"BalkanAgent");logout.onclick=BA.signOut;logoutSide.onclick=e=>{e.preventDefault();BA.signOut()};mobileMenu.onclick=()=>sidebar.classList.toggle("open");const [s,ps,ds]=await Promise.all([BA.adminStats(),BA.profiles(),BA.demos()]);cu.textContent=s.users;cd.textContent=s.demos;cn.textContent=s.newsletters;ur.innerHTML=ps.map(x=>`<tr><td>${BA.esc(x.full_name||"")}</td><td>${BA.esc(x.email)}</td><td>${BA.esc(x.company_name||"")}</td><td><select data-u="${x.id}" data-f="plan">${["Starter","Business","Pro","Enterprise"].map(v=>`<option ${x.plan===v?"selected":""}>${v}</option>`).join("")}</select></td><td><select data-u="${x.id}" data-f="status">${["trial","active","suspended"].map(v=>`<option ${x.status===v?"selected":""}>${v}</option>`).join("")}</select></td><td><span class="pill">${BA.esc(x.role)}</span></td></tr>`).join("");document.querySelectorAll("[data-u]").forEach(e=>e.onchange=async()=>{try{await BA.adminUpdate(e.dataset.u,{[e.dataset.f]:e.value});BA.notice("Korisnik je ažuriran.",true)}catch(err){BA.notice(err.message)}});dr.innerHTML=ds.map(x=>`<tr><td>${BA.esc(x.name)}</td><td>${BA.esc(x.email)}</td><td>${BA.esc(x.company_name||"")}</td><td>${BA.esc(x.message||"")}</td><td><span class="pill">${BA.esc(x.status)}</span></td></tr>`).join("");}catch(err){alert("Greška: "+err.message)}})();</script></body></html>
