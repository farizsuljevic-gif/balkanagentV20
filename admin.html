<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — BalkanAgent</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span>BALKANAGENT ADMIN</a></header><main class="shell section"><div class="eyebrow">ADMIN PANEL</div><h1>User activation</h1><div id="notice" class="notice"></div><div id="users" class="list"></div></main><script src="/app.js"></script><script>(async()=>{const u=await BA.requireUser();if(!u.is_admin){location.href='/dashboard.html';return}const d=await BA.api('/api/admin/users');users.innerHTML=d.items.map(x=>`<div class="row"><div><strong>${x.full_name}</strong><div class="muted">${x.email} · ${x.company_name||'No company'} · ${x.created_at}</div></div><div><select class="input" data-id="${x.id}" data-plan="${x.plan}"><option ${x.status==='pending'?'selected':''}>pending</option><option ${x.status==='active'?'selected':''}>active</option><option ${x.status==='suspended'?'selected':''}>suspended</option></select><button class="btn save" data-id="${x.id}">Save</button></div></div>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const s=document.querySelector(`select[data-id="${b.dataset.id}"]`);await BA.api('/api/admin/users',{method:'PATCH',body:JSON.stringify({id:b.dataset.id,status:s.value,plan:s.dataset.plan})});b.textContent='Saved ✓'})})().catch(e=>BA.msg(e.message));</script></body></html>
