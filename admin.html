<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><main class="shell section"><div class="topbar"><div><div class="eyebrow">BALKANAGENT V3</div><h1 data-i18n="adminTitle">Enterprise admin</h1></div><a class="btn ghost" href="/dashboard.html">Dashboard</a></div><div id="notice" class="notice"></div><section class="stats" id="stats"></section><section class="section"><h2 data-i18n="users">Users and subscriptions</h2><div id="usersList" class="list"></div></section><section class="section"><div class="card"><h2 data-i18n="changePassword">Change admin password</h2><form id="passwordForm" class="form"><input class="input" type="password" name="password" minlength="10" placeholder="New secure password" required><button class="btn" data-i18n="save">Save</button></form></div></section></main><script src="/app.js"></script><script>(async()=>{const u=await BA.requireUser();if(!u.is_admin){location.href='/dashboard.html';return}const [s,d]=await Promise.all([BA.api('/api/admin/stats'),BA.api('/api/admin/users')]);stats.innerHTML=[['Users',s.users],['Active',s.active],['AI employees',s.agents],['Bookings',s.bookings],['Invoices',s.invoices]].map(x=>`<article class="card stat"><span>${x[0]}</span><strong>${x[1]}</strong></article>`).join('');usersList.innerHTML=d.items.map(x=>`<div class="row"><div><strong>${x.full_name}</strong><div class="muted">${x.email} · ${x.company_name||'No company'} · ${x.subscription_status||'none'}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><select class="input status" data-id="${x.id}"><option ${x.status==='active'?'selected':''}>active</option><option ${x.status==='pending'?'selected':''}>pending</option><option ${x.status==='suspended'?'selected':''}>suspended</option></select><select class="input plan" data-id="${x.id}">${['starter','growth','business','enterprise'].map(p=>`<option ${x.plan===p?'selected':''}>${p}</option>`).join('')}</select><button class="btn save" data-id="${x.id}">Save</button></div></div>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const id=b.dataset.id;await BA.api('/api/admin/users',{method:'PATCH',body:JSON.stringify({id,status:document.querySelector(`.status[data-id="${id}"]`).value,plan:document.querySelector(`.plan[data-id="${id}"]`).value})});b.textContent='Saved ✓'});passwordForm.onsubmit=async e=>{e.preventDefault();await BA.api('/api/auth/password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(passwordForm)))});location.href='/login.html'}})().catch(e=>BA.msg(e.message))</script></body></html>
