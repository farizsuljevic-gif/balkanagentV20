<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel — BalkanAgent</title><link rel="stylesheet" href="app.css"><script src="app.js"></script></head><body><div class="app"><aside class="side" id="side"><a class="brand" href="index.html"><span class="mark">BA</span><span class="brand-copy"><b>BALKAN<span>AGENT</span></b><small>AI AUTOMATION PLATFORM</small></span></a><nav><a class="" href="dashboard.html">Pregled</a><a class="" href="profile.html">Profil</a><a class="admin" href="admin.html">Admin panel</a><a href="index.html">Javni sajt</a><a href="#" id="logoutSide">Odjava</a></nav></aside><main class="content"><header class="top"><div><button class="menu-btn secondary" id="menuBtn">☰</button><h1>Admin panel</h1><p id="welcome" class="muted"></p></div><div><a class="btn secondary" href="index.html">Javni sajt</a> <button id="logout">Odjava</button></div></header><section class="metrics"><article class="metric"><span>Korisnici</span><b id="count">0</b></article><article class="metric"><span>Admin</span><b>1</b></article><article class="metric"><span>Aktivni planovi</span><b id="plans">0</b></article><article class="metric"><span>Demo zahtjevi</span><b id="demos">0</b></article></section><section class="panel"><h2>Korisnici</h2><div class="table-wrap"><table><thead><tr><th>Ime</th><th>Email</th><th>Firma</th><th>Paket</th><th>Uloga</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script>const user=BA.requireUser(true);if(user)welcome.textContent=user.name+" · "+(user.company||"BalkanAgent");logout.onclick=BA.logout;logoutSide.onclick=e=>{e.preventDefault();BA.logout()};menuBtn.onclick=()=>side.classList.toggle("open");function render(){const list=BA.users();count.textContent=list.length;plans.textContent=list.filter(x=>x.plan).length;demos.textContent=JSON.parse(localStorage.getItem("ba_public_demos")||"[]").length;rows.innerHTML=list.map(x=>`<tr><td>${BA.escapeHtml(x.name)}</td><td>${BA.escapeHtml(x.email)}</td><td>${BA.escapeHtml(x.company||"")}</td><td><span class="pill">${BA.escapeHtml(x.plan)}</span></td><td>${BA.escapeHtml(x.role)}</td></tr>`).join("")}render();</script></body></html>
