<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel — BalkanAgent</title><link rel="stylesheet" href="app-pages.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand">BA&nbsp; BALKAN<span>AGENT</span></div><div class="tagline">AI AUTOMATION PLATFORM</div><nav><a href="dashboard.html" class="">Pregled</a><a href="conversations.html" class="">Razgovori</a><a href="bookings.html" class="">Rezervacije</a><a href="agents.html" class="">AI zaposleni</a><a href="billing.html" class="">Naplata</a><a href="profile.html" class="">Profil</a><a href="admin.html" class="admin-link active">Admin panel</a><a href="index.html">Javni sajt</a><a href="#" id="logoutLink">Odjava</a></nav></aside><main class="main"><header class="topbar"><div><button class="mobile-menu secondary" id="mobileMenu">☰</button><h1>Admin panel</h1><p class="muted" id="welcome"></p></div><div class="top-actions"><a class="btn secondary" href="index.html">Javni sajt</a><button id="logoutBtn">Odjava</button></div></header>
<section class="grid4"><div class="metric"><span>Korisnici</span><b id="uCount">0</b></div><div class="metric"><span>Aktivni</span><b id="activeCount">0</b></div><div class="metric"><span>AI zaposleni</span><b id="agentCount">0</b></div><div class="metric"><span>Rezervacije</span><b id="bookingCount">0</b></div></section>
<section class="panel"><h2>Upravljanje korisnicima</h2><div class="table-wrap"><table><thead><tr><th>Ime</th><th>Email</th><th>Firma</th><th>Plan</th><th>Status</th><th>Uloga</th><th>Radnje</th></tr></thead><tbody id="userRows"></tbody></table></div><div id="notice" class="notice"></div></section>
</main></div><script>
const pageUser=BA.requireUser(true);
if(pageUser){
 document.getElementById("welcome").textContent=pageUser.name+" · "+pageUser.company;
 const adminNav=document.getElementById("adminNav");if(adminNav&&pageUser.role==="admin")adminNav.style.display="block";
}
document.getElementById("logoutBtn").onclick=BA.logout;
document.getElementById("logoutLink").onclick=function(e){e.preventDefault();BA.logout();};
document.getElementById("mobileMenu").onclick=function(){document.getElementById("sidebar").classList.toggle("open");};

function renderAdmin(){const list=BA.users();uCount.textContent=list.length;activeCount.textContent=list.filter(x=>x.status==="active").length;agentCount.textContent=BA.collection("agents").length;bookingCount.textContent=BA.collection("bookings").length;userRows.innerHTML=list.map(u=>`<tr><td>${BA.escapeHtml(u.name)}</td><td>${BA.escapeHtml(u.email)}</td><td>${BA.escapeHtml(u.company)}</td><td><select data-plan="${u.id}"><option ${u.plan==="Starter"?"selected":""}>Starter</option><option ${u.plan==="Business"?"selected":""}>Business</option><option ${u.plan==="Pro"?"selected":""}>Pro</option><option ${u.plan==="Enterprise"?"selected":""}>Enterprise</option></select></td><td><span class="status ${u.status==="suspended"?"suspended":""}">${u.status}</span></td><td>${u.role}</td><td class="row-actions">${u.role==="admin"?"Glavni admin":`<button class="small-btn secondary" data-status="${u.id}">${u.status==="active"?"Suspenduj":"Aktiviraj"}</button><button class="small-btn danger" data-delete="${u.id}">Obriši</button>`}</td></tr>`).join("");document.querySelectorAll("[data-plan]").forEach(s=>s.onchange=()=>{BA.adminUpdateUser(s.dataset.plan,{plan:s.value});BA.notice("Plan je promijenjen.",true);renderAdmin();});document.querySelectorAll("[data-status]").forEach(b=>b.onclick=()=>{const u=BA.users().find(x=>x.id===b.dataset.status);BA.adminUpdateUser(u.id,{status:u.status==="active"?"suspended":"active"});renderAdmin();});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{const list=BA.users().filter(x=>x.id!==b.dataset.delete);BA.saveUsers(list);renderAdmin();});}
renderAdmin();

</script></body></html>
