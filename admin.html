<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Panel — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><div class="app"><aside class="side" id="side"><img src="logo.png" alt="BalkanAgent"><a class="active" href="admin.html" data-i18n="admin">Admin Panel</a><a href="index.html">Public website</a><a href="#" id="logoutSide" data-i18n="logout">Log out</a></aside><main class="content"><header class="top"><div><button class="mobileapp btn" id="mobileMenu">☰</button><h1>Admin Panel</h1><p class="muted" id="welcome"></p></div><div><select data-lang-select><option value="me">🇲🇪 Crnogorski</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="ru">🇷🇺 Русский</option><option value="sq">🇦🇱 Shqip</option><option value="sl">🇸🇮 Slovenščina</option><option value="mk">🇲🇰 Македонски</option><option value="bg">🇧🇬 Български</option><option value="el">🇬🇷 Ελληνικά</option><option value="ro">🇷🇴 Română</option><option value="tr">🇹🇷 Türkçe</option></select> <button class="btn primary" id="logout" data-i18n="logout">Log out</button></div></header><section class="metrics"><article class="metric"><span>Users</span><b id="usersN">0</b></article><article class="metric"><span>Bots</span><b id="botsN">0</b></article><article class="metric"><span>Leads</span><b id="leadsN">0</b></article><article class="metric"><span>Plan requests</span><b id="reqN">0</b></article></section><section class="panel"><h2>Users</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Plan</th><th>Status</th><th>Role</th></tr></thead><tbody id="userRows"></tbody></table></div><div id="notice" class="notice"></div></section><section class="panel" style="margin-top:13px"><h2>Payment requests</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>User</th><th>Plan</th><th>Status</th><th>Action</th></tr></thead><tbody id="payRows"></tbody></table></div></section><section class="panel" style="margin-top:13px"><h2>Demo requests</h2><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Message</th></tr></thead><tbody id="demoRows"></tbody></table></div></section></main></div><script>(async()=>{try{const auth=await BA.requireUser(true);if(!auth)return;window.currentAuth=auth;welcome.textContent=(auth.profile.full_name||auth.profile.email)+' · '+(auth.profile.company_name||'BalkanAgent');logout.onclick=BA.signout;logoutSide.onclick=e=>{e.preventDefault();BA.signout()};mobileMenu.onclick=()=>side.classList.toggle('open');
async function renderAdmin(){const d=await BA.adminData();usersN.textContent=d.profiles.length;botsN.textContent=d.bots.length;leadsN.textContent=d.leads.length;reqN.textContent=d.requests.length;userRows.innerHTML=d.profiles.map(x=>`<tr><td>${BA.esc(x.full_name||'')}</td><td>${BA.esc(x.email)}</td><td>${BA.esc(x.company_name||'')}</td><td><select data-u="${x.id}" data-f="plan">${['Starter','Business','Pro','Enterprise'].map(v=>`<option ${x.plan===v?'selected':''}>${v}</option>`).join('')}</select></td><td><select data-u="${x.id}" data-f="status">${['trial','active','suspended'].map(v=>`<option ${x.status===v?'selected':''}>${v}</option>`).join('')}</select></td><td>${BA.esc(x.role)}</td></tr>`).join('');document.querySelectorAll('[data-u]').forEach(s=>s.onchange=async()=>{await BA.adminUpdateProfile(s.dataset.u,{[s.dataset.f]:s.value});BA.notice('User updated.',true)});payRows.innerHTML=d.requests.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${BA.esc(x.user_id)}</td><td>${BA.esc(x.plan)}</td><td>${BA.esc(x.status)}</td><td><button class="btn small approve" data-id="${x.id}">Approve</button></td></tr>`).join('');document.querySelectorAll('.approve').forEach(b=>b.onclick=async()=>{await BA.adminUpdatePayment(b.dataset.id,{status:'approved'});renderAdmin()});demoRows.innerHTML=d.demos.map(x=>`<tr><td>${BA.esc(x.name)}</td><td>${BA.esc(x.email)}</td><td>${BA.esc(x.company_name||'')}</td><td>${BA.esc(x.message||'')}</td></tr>`).join('')}renderAdmin();
}catch(x){alert(x.message);console.error(x)}})();</script></body></html>
