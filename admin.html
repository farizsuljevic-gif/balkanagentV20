<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — BalkanAgent</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span>BALKANAGENT ADMIN</a><a class="btn ghost" href="/dashboard.html">Dashboard</a></header><main class="shell section"><div class="eyebrow">ADMIN PANEL</div><h1>Business overview</h1><div id="notice" class="notice"></div><section class="stats" id="stats"></section><section class="section"><div class="topbar"><div><h2>Users and activation</h2><p class="muted">Activate, suspend and assign subscription plans.</p></div></div><div id="users" class="list"></div></section><section class="section"><div class="card"><h2>Change admin password</h2><form id="passwordForm" class="form"><input class="input" type="password" name="password" minlength="10" placeholder="New secure password" required><button class="btn">Change password</button></form></div></section></main><script src="/app.js"></script><script>(async()=>{const u=await BA.requireUser();if(!u.is_admin){location.href='/dashboard.html';return}const [s,d]=await Promise.all([BA.api('/api/admin/stats'),BA.api('/api/admin/users')]);stats.innerHTML=[['Users',s.users],['Active',s.active],['Pending',s.pending],['AI employees',s.agents],['Conversations',s.conversations],['Bookings',s.bookings]].map(x=>`<article class="card stat"><span class="muted">${x[0]}</span><strong>${x[1]}</strong></article>`).join('');users.innerHTML=d.items.map(x=>`<div class="row"><div><strong>${x.full_name}</strong><div class="muted">${x.email} · ${x.company_name||'No company'} · ${x.created_at}</div></div><div style="display:flex;gap:8px;flex-wrap:wrap"><select class="input status" data-id="${x.id}"><option ${x.status==='pending'?'selected':''}>pending</option><option ${x.status==='active'?'selected':''}>active</option><option ${x.status==='suspended'?'selected':''}>suspended</option></select><select class="input plan" data-id="${x.id}"><option ${x.plan==='starter'?'selected':''}>starter</option><option ${x.plan==='business'?'selected':''}>business</option><option ${x.plan==='professional'?'selected':''}>professional</option></select><button class="btn save" data-id="${x.id}">Save</button></div></div>`).join('');document.querySelectorAll('.save').forEach(b=>b.onclick=async()=>{const id=b.dataset.id,status=document.querySelector(`.status[data-id="${id}"]`).value,plan=document.querySelector(`.plan[data-id="${id}"]`).value;await BA.api('/api/admin/users',{method:'PATCH',body:JSON.stringify({id,status,plan})});b.textContent='Saved ✓'});passwordForm.onsubmit=async e=>{e.preventDefault();await BA.api('/api/auth/password',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(passwordForm)))});BA.msg('Password changed successfully.');passwordForm.reset()}})().catch(e=>BA.msg(e.message));</script></body></html>
