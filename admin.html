<!doctype html><html lang="cnr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Balkan Agent — Admin test</title><style>:root{--bg:#07101a;--card:#0e1b2a;--line:#223a55;--text:#f7f9fc;--muted:#9eacbc;--blue:#2f7df6;--green:#45d49b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{width:min(1100px,calc(100% - 28px));margin:40px auto}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;margin-bottom:16px}input,select,button{font:inherit}input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#07131f;color:#fff;margin:7px 0 13px}.btn{padding:11px 15px;border-radius:10px;border:1px solid var(--line);background:#10243a;color:#fff;cursor:pointer}.primary{background:var(--blue);border-color:var(--blue)}.muted{color:var(--muted)}.hidden{display:none}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stat{padding:16px;border:1px solid var(--line);border-radius:14px;background:#0a1724}.stat strong{font-size:28px;display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}.table th{color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.empty{text-align:center;padding:35px;color:var(--muted)}@media(max-width:760px){.stats{grid-template-columns:1fr}.table thead{display:none}.table,.table tbody,.table tr,.table td{display:block}.table tr{border:1px solid var(--line);border-radius:12px;margin:10px 0;padding:8px}.table td{border:0;padding:7px}.table td:before{content:attr(data-label);display:block;color:var(--muted);font-size:12px}}</style></head><body><div class="wrap"><section class="card" id="login"><h1>Admin test</h1><p class="muted">Ovaj panel čita samo testne upite sačuvane u ovom pregledniku.</p><label>Admin e-mail<input id="email" type="email" value="ceo@balkanagent.com"></label><label>Šifra<input id="password" type="password" placeholder="Unesite šifru"></label><button class="btn primary" id="login-btn">Prijavi se</button><p id="login-status"></p></section><main id="panel" class="hidden"><div class="top"><div><h1>Balkan Agent — Admin test</h1><p class="muted">Prijavljen: ceo@balkanagent.com</p></div><div class="actions"><a class="btn" href="index.html">Nazad na sajt</a><button class="btn" id="export">CSV izvoz</button><button class="btn" id="logout">Odjava</button></div></div><div class="stats"><div class="stat"><span class="muted">Ukupno upita</span><strong id="total">0</strong></div><div class="stat"><span class="muted">Novi</span><strong id="new-count">0</strong></div><div class="stat"><span class="muted">Kontaktirani</span><strong id="contacted">0</strong></div></div><section class="card"><div class="top"><h2>Testni upiti</h2><button class="btn" id="clear">Obriši sve</button></div><div id="lead-list"></div></section></main></div><script>const EMAIL='ceo@balkanagent.com',PASSWORD='BA-TEST-2026',login=document.getElementById('login'),panel=document.getElementById('panel'),status=document.getElementById('login-status');function leads(){try{return JSON.parse(localStorage.getItem('ba_leads')||'[]')}catch{return[]}}function save(x){localStorage.setItem('ba_leads',JSON.stringify(x))}function render(){const x=leads();document.getElementById('total').textContent=x.length;document.getElementById('new-count').textContent=x.filter(i=>i.status==='Novi').length;document.getElementById('contacted').textContent=x.filter(i=>i.status==='Kontaktiran').length;const list=document.getElementById('lead-list');if(!x.length){list.innerHTML='<div class="empty">Još nema testnih upita u ovom pregledniku.</div>';return}list.innerHTML='<table class="table"><thead><tr><th>Datum</th><th>Klijent</th><th>Paket</th><th>Poruka</th><th>Status</th><th>Akcije</th></tr></thead><tbody>'+x.map(i=>`<tr><td data-label="Datum">${new Date(i.createdAt).toLocaleString('sr-ME')}</td><td data-label="Klijent"><strong>${esc(i.name||'')}</strong><br>${esc(i.company||'')}<br><a href="mailto:${esc(i.email||'')}">${esc(i.email||'')}</a><br>${esc(i.phone||'')}</td><td data-label="Paket">${esc(i.package||'')}</td><td data-label="Poruka">${esc(i.message||'')}</td><td data-label="Status">${esc(i.status||'Novi')}</td><td data-label="Akcije"><div class="actions"><button class="btn" data-contact="${i.id}">Kontaktiran</button><button class="btn" data-delete="${i.id}">Obriši</button></div></td></tr>`).join('')+'</tbody></table>';document.querySelectorAll('[data-contact]').forEach(b=>b.onclick=()=>{const y=leads();const z=y.find(i=>i.id==b.dataset.contact);if(z)z.status='Kontaktiran';save(y);render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{save(leads().filter(i=>i.id!=b.dataset.delete));render()})}function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}document.getElementById('login-btn').onclick=()=>{if(document.getElementById('email').value.trim().toLowerCase()===EMAIL&&document.getElementById('password').value===PASSWORD){sessionStorage.setItem('ba_admin','1');show()}else status.textContent='Pogrešan e-mail ili šifra.'};function show(){login.classList.add('hidden');panel.classList.remove('hidden');render()}if(sessionStorage.getItem('ba_admin')==='1')show();document.getElementById('logout').onclick=()=>{sessionStorage.removeItem('ba_admin');location.reload()};document.getElementById('clear').onclick=()=>{if(confirm('Obrisati sve testne upite iz ovog preglednika?')){save([]);render()}};document.getElementById('export').onclick=()=>{const x=leads(),rows=[['Datum','Ime','Firma','Email','Telefon','Paket','Poruka','Status'],...x.map(i=>[i.createdAt,i.name,i.company,i.email,i.phone,i.package,i.message,i.status])],csv=rows.map(r=>r.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='balkan-agent-upiti.csv';a.click();URL.revokeObjectURL(a.href)};</script></body></html>
