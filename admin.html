<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin panel — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="app.js"></script></head><body><div class="app-layout"><aside class="sidebar" id="sidebar"><img src="balkanagent-logo.jpg" alt="BalkanAgent"><a href="admin.html" class="active">Admin pregled</a><a href="dashboard.html">Korisnički pregled</a><a href="index.html">Javni sajt</a><a href="#" id="logoutSide">Odjava</a></aside><main class="app-content"><header class="app-topbar"><div><button class="mobile-app-menu btn btn-secondary" id="mobileMenu">☰</button><h1>Admin panel</h1><p class="muted" id="welcome"></p></div><div><a class="btn btn-secondary" href="index.html">Javni sajt</a> <button class="btn btn-primary" id="logout">Odjava</button></div></header><section class="metrics"><article class="metric"><span>Korisnici</span><b id="count">0</b></article><article class="metric"><span>Aktivni paketi</span><b id="plans">0</b></article><article class="metric"><span>Demo zahtjevi</span><b id="demos">0</b></article><article class="metric"><span>Administrator</span><b>1</b></article></section><section class="app-panel"><h2>Upravljanje korisnicima</h2><div class="table-wrap"><table><thead><tr><th>Ime</th><th>Email</th><th>Firma</th><th>Paket</th><th>Uloga</th><th>Radnje</th></tr></thead><tbody id="rows"></tbody></table></div><div id="notice" class="notice"></div></section></main></div><script>const user=BA.requireUser(true);if(user)welcome.textContent=user.name+" · "+(user.company||"BalkanAgent");logout.onclick=BA.logout;logoutSide.onclick=e=>{e.preventDefault();BA.logout()};mobileMenu.onclick=()=>sidebar.classList.toggle("open");function render(){const list=BA.users();count.textContent=list.length;plans.textContent=list.filter(x=>x.plan).length;demos.textContent=BA.read(BA.K.demos,[]).length;rows.innerHTML=list.map(x=>`<tr><td>${BA.esc(x.name)}</td><td>${BA.esc(x.email)}</td><td>${BA.esc(x.company||"")}</td><td>${x.role==="admin"?BA.esc(x.plan):`<select data-plan="${x.id}"><option ${x.plan==="Starter"?"selected":""}>Starter</option><option ${x.plan==="Business"?"selected":""}>Business</option><option ${x.plan==="Pro"?"selected":""}>Pro</option><option ${x.plan==="Enterprise"?"selected":""}>Enterprise</option></select>`}</td><td><span class="pill">${BA.esc(x.role)}</span></td><td>${x.role==="admin"?"Glavni admin":`<button class="btn small danger" data-delete="${x.id}">Obriši</button>`}</td></tr>`).join("");document.querySelectorAll("[data-plan]").forEach(s=>s.onchange=()=>{BA.update(s.dataset.plan,{plan:s.value});BA.notice("Paket je promijenjen.",true);render()});document.querySelectorAll("[data-delete]").forEach(b=>b.onclick=()=>{BA.remove(b.dataset.delete);render()})}render();</script></body></html>
