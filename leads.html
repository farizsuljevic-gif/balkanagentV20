<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leads — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><div class="app"><aside class="side" id="side"><img src="logo.png" alt="BalkanAgent"><a href="dashboard.html" class="" data-i18n="dashboard">Dashboard</a><a href="bots.html" class="" data-i18n="bots">Bots</a><a href="leads.html" class="active" data-i18n="leads">Leads</a><a href="billing.html" class="" data-i18n="billing">Billing</a><a href="profile.html" class="" data-i18n="profile">Profile</a><a href="index.html">Public website</a><a href="#" id="logoutSide" data-i18n="logout">Log out</a></aside><main class="content"><header class="top"><div><button class="mobileapp btn" id="mobileMenu">☰</button><h1>Leads</h1><p class="muted" id="welcome"></p></div><div><select data-lang-select><option value="me">🇲🇪 Crnogorski</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="ru">🇷🇺 Русский</option><option value="sq">🇦🇱 Shqip</option><option value="sl">🇸🇮 Slovenščina</option><option value="mk">🇲🇰 Македонски</option><option value="bg">🇧🇬 Български</option><option value="el">🇬🇷 Ελληνικά</option><option value="ro">🇷🇴 Română</option><option value="tr">🇹🇷 Türkçe</option></select> <button class="btn primary" id="logout" data-i18n="logout">Log out</button></div></header><section class="panel"><h2>Captured leads</h2><div class="tablewrap"><table><thead><tr><th>Date</th><th>Bot</th><th>Name</th><th>Email</th><th>Phone</th><th>Message</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div><script>(async()=>{try{const auth=await BA.requireUser(false);if(!auth)return;window.currentAuth=auth;welcome.textContent=(auth.profile.full_name||auth.profile.email)+' · '+(auth.profile.company_name||'BalkanAgent');logout.onclick=BA.signout;logoutSide.onclick=e=>{e.preventDefault();BA.signout()};mobileMenu.onclick=()=>side.classList.toggle('open');const list=await BA.listLeads();rows.innerHTML=list.length?list.map(x=>`<tr><td>${new Date(x.created_at).toLocaleString()}</td><td>${BA.esc(x.bots?.name||'')}</td><td>${BA.esc(x.name||'')}</td><td>${BA.esc(x.email||'')}</td><td>${BA.esc(x.phone||'')}</td><td>${BA.esc(x.message||'')}</td></tr>`).join(''):'<tr><td colspan="6">No leads yet.</td></tr>';}catch(x){alert(x.message);console.error(x)}})();</script></body></html>
