<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Employees — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><div class="app"><div id="side"></div><main class="main"><div class="topbar"><div><div class="eyebrow">AI TEAM</div><h1 data-i18n="agents">AI Employees</h1></div><button class="btn" onclick="modal.classList.add('open')" data-i18n="newEmployee">New employee</button></div><div id="list" class="list"></div></main></div><div id="modal" class="modal"><form id="agentForm" class="card form"><h2 data-i18n="newEmployee">New employee</h2><input class="input" name="name" placeholder="Name, e.g. Sofia" required><input class="input" name="role" data-i18n-placeholder="role" placeholder="Role" required><select class="input" name="language"><option value="en">English</option><option value="me">Crnogorski</option><option value="de">Deutsch</option><option value="sq">Shqip</option><option value="hr">Hrvatski</option><option value="sr">Srpski</option><option value="bs">Bosanski</option><option value="mk">Македонски</option><option value="sl">Slovenščina</option><option value="it">Italiano</option><option value="tr">Türkçe</option><option value="ru">Русский</option></select><textarea class="input" name="instructions" data-i18n-placeholder="instructions" placeholder="Instructions"></textarea><button class="btn" data-i18n="create">Create</button><button type="button" class="btn ghost" onclick="modal.classList.remove('open')" data-i18n="cancel">Cancel</button></form></div><script src="/app.js"></script><script>side.innerHTML=BA.sidebar('agents');async function load(){const u=await BA.requireUser();if(u.is_admin)adminLink.hidden=false;const d=await BA.api('/api/agents');list.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><div><strong>${x.name}</strong><div class="muted">${x.role} · ${x.language}</div></div><span class="pill">${x.status}</span></div>`).join(''):'<div class="card muted">No AI employees yet.</div>'}agentForm.onsubmit=async e=>{e.preventDefault();try{await BA.api('/api/agents',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(agentForm)))});modal.classList.remove('open');agentForm.reset();load()}catch(x){alert(x.message)}};load()</script></body></html>
