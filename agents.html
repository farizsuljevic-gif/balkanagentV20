<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI zaposleni — BalkanAgent</title><link rel="stylesheet" href="app-pages.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand">BA&nbsp; BALKAN<span>AGENT</span></div><div class="tagline">AI AUTOMATION PLATFORM</div><nav><a href="dashboard.html" class="">Pregled</a><a href="conversations.html" class="">Razgovori</a><a href="bookings.html" class="">Rezervacije</a><a href="agents.html" class="active">AI zaposleni</a><a href="billing.html" class="">Naplata</a><a href="profile.html" class="">Profil</a><a href="admin.html" class="admin-link" id="adminNav" style="display:none">Admin panel</a><a href="index.html">Javni sajt</a><a href="#" id="logoutLink">Odjava</a></nav></aside><main class="main"><header class="topbar"><div><button class="mobile-menu secondary" id="mobileMenu">☰</button><h1>AI zaposleni</h1><p class="muted" id="welcome"></p></div><div class="top-actions"><a class="btn secondary" href="index.html">Javni sajt</a><button id="logoutBtn">Odjava</button></div></header>
<section class="grid2"><article class="panel"><h2>Novi AI zaposleni</h2><form id="itemForm" class="form-grid"><label>Ime<input id="agentName" required></label><label>Uloga<select id="role"><option>Sales Agent</option><option>Booking Agent</option><option>Support Agent</option><option>Marketing Agent</option></select></label><label class="wide">Kanali<input id="channels" placeholder="WhatsApp, Instagram, Website"></label><button class="wide">Dodaj AI zaposlenog</button></form><div id="notice" class="notice"></div></article><article class="panel"><h2>Kako radi</h2><p class="muted">Svaki AI zaposleni može imati svoju ulogu, kanale i aktivni status.</p></article></section><section class="panel" style="margin-top:12px"><h2>AI zaposleni</h2><div class="table-wrap"><table><thead><tr><th>Ime</th><th>Uloga</th><th>Kanali</th><th>Status</th><th>Radnje</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main></div><script>
const pageUser=BA.requireUser(false);
if(pageUser){
 document.getElementById("welcome").textContent=pageUser.name+" · "+pageUser.company;
 const adminNav=document.getElementById("adminNav");if(adminNav&&pageUser.role==="admin")adminNav.style.display="block";
}
document.getElementById("logoutBtn").onclick=BA.logout;
document.getElementById("logoutLink").onclick=function(e){e.preventDefault();BA.logout();};
document.getElementById("mobileMenu").onclick=function(){document.getElementById("sidebar").classList.toggle("open");};

function render(){const items=BA.ownerItems("agents");rows.innerHTML=items.map(x=>`<tr><td>${BA.escapeHtml(x.name)}</td><td>${BA.escapeHtml(x.role)}</td><td>${BA.escapeHtml(x.channels)}</td><td><span class="status ${x.status==="paused"?"pending":""}">${BA.escapeHtml(x.status)}</span></td><td class="row-actions"><button class="small-btn secondary" data-toggle="${x.id}">${x.status==="active"?"Pauziraj":"Aktiviraj"}</button><button class="small-btn danger" data-remove="${x.id}">Obriši</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">Nema AI zaposlenih.</td></tr>';document.querySelectorAll("[data-toggle]").forEach(b=>b.onclick=()=>{const item=BA.collection("agents").find(x=>x.id===b.dataset.toggle);BA.updateItem("agents",item.id,{status:item.status==="active"?"paused":"active"});render();});document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{BA.removeItem("agents",b.dataset.remove);render();});}
itemForm.onsubmit=e=>{e.preventDefault();BA.addItem("agents",{name:agentName.value,role:role.value,channels:channels.value,status:"active"});itemForm.reset();BA.notice("AI zaposleni je dodat.",true);render();};render();

</script></body></html>
