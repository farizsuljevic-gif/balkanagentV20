<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Employees — BalkanAgent</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span>BALKANAGENT</a></header><div class="app"><aside class="side"><a href="/dashboard.html">Overview</a><a class="active" href="/agents.html">AI Employees</a><a href="/conversations.html">Conversations</a><a href="/bookings.html">Bookings</a><a href="/profile.html">Company profile</a><a href="/billing.html">Billing</a></aside><main class="main"><div class="topbar"><div><div class="eyebrow">AI TEAM</div><h1>AI Employees</h1></div><button class="btn" onclick="modal.classList.add('open')">New employee</button></div><div id="list" class="list"></div></main></div><div id="modal" class="modal"><form id="agentForm" class="card form"><h2>Create AI employee</h2><input class="input" name="name" placeholder="Name, e.g. Sofia" required><input class="input" name="role" placeholder="Role, e.g. Hotel receptionist" required><select class="input" name="language"><option value="en">English</option><option value="bs">Bosnian</option><option value="de">German</option><option value="sq">Albanian</option></select><textarea class="input" name="instructions" placeholder="Main tasks and rules"></textarea><button class="btn">Create</button><button type="button" class="btn ghost" onclick="modal.classList.remove('open')">Cancel</button></form></div><script src="/app.js"></script><script>async function load(){await BA.requireUser();const d=await BA.api('/api/agents');list.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><div><strong>${x.name}</strong><div class="muted">${x.role} · ${x.language}</div></div><span>${x.status}</span></div>`).join(''):'<div class="card muted">No AI employees yet.</div>'}agentForm.onsubmit=async e=>{e.preventDefault();await BA.api('/api/agents',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(agentForm)))});modal.classList.remove('open');agentForm.reset();load()};load()</script></body></html>
