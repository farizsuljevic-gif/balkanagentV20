<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Employees — BalkanAgent</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><img src="/logo.svg"><div><b><span>BALKAN</span><span>AGENT</span></b><small>CONTROL CENTRE</small></div></a><nav class="side-nav">
<a data-page="dashboard" href="/dashboard.html">◫ Overview</a><a data-page="conversations" href="/conversations.html">◉ Conversations</a><a data-page="bookings" href="/bookings.html">◇ Bookings</a><a data-page="agents" href="/agents.html">✦ AI Employees</a><a data-page="profile" href="/profile.html">◌ Company profile</a><a data-page="billing" href="/billing.html">◈ Billing</a><a data-admin data-page="admin" href="/admin.html">⚙ Admin</a></nav><div class="side-bottom"><button class="btn ghost" style="width:100%" id="logoutBtn">Log out</button></div></aside><main class="main"><div class="topbar"><div><button class="btn ghost sm mobile-toggle" onclick="BA.toggleMenu()">☰</button><div class="eyebrow">BALKANAGENT</div><h2>AI Employees</h2></div><div style="display:flex;align-items:center;gap:12px"><span id="userName" class="hide-mobile muted"></span><div class="avatar" id="avatar">BA</div></div></div><div id="notice" class="notice"></div><div class="topbar"><div><h3>Your AI team</h3><p class="muted">Create and manage specialised AI employees.</p></div><button class="btn" id="newBtn">+ New employee</button></div><div class="grid-3" id="items"></div><dialog id="modal" class="card" style="color:white;background:#0b1120;border-color:#263454;border-radius:18px"><form id="agentForm" class="form"><h3>Create AI employee</h3><input class="input" name="name" placeholder="Employee name" required><select class="input" name="role"><option>Sales Agent</option><option>Booking Agent</option><option>Support Agent</option><option>Marketing Agent</option></select><textarea class="input" name="instructions" placeholder="What should this AI employee do?"></textarea><div class="row-actions"><button class="btn">Create</button><button type="button" class="btn ghost" onclick="modal.close()">Cancel</button></div></form></dialog></main></div><script src="/app.js"></script><script>
(async()=>{const user=await BA.requireUser(false);if(!user)return;document.querySelector('[data-page="agents"]')?.classList.add("active");document.querySelectorAll("[data-admin]").forEach(x=>x.style.display=user.is_admin?"block":"none");userName.textContent=user.full_name||user.email;avatar.textContent=(user.full_name||"BA").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();logoutBtn.onclick=async()=>{await BA.api("/api/auth/logout",{method:"POST"});location.href="/login.html"};async function load(){const d=await BA.api("/api/agents");items.innerHTML=d.items.map(x=>`<article class="card"><div class="status">${BA.escape(x.status)}</div><h3>${BA.escape(x.name)}</h3><p class="muted">${BA.escape(x.role)}</p><p>${BA.escape(x.instructions||"Ready to work.")}</p></article>`).join("")||`<article class="card muted">No AI employees yet.</article>`}await load();newBtn.onclick=()=>modal.showModal();agentForm.onsubmit=async e=>{e.preventDefault();await BA.api("/api/agents",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(agentForm)))});modal.close();agentForm.reset();await load()};})().catch(e=>BA.msg(e.message));
</script></body></html>
