<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administracija — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-app.js"></script></head><body><main class="auth-page"><section class="auth-box glass"><a href="index.html"><img src="balkanagent-logo.jpg" alt="BalkanAgent"></a><h1>Administracija</h1><p class="muted">Pristup je dozvoljen samo ovlašćenom administratoru.</p><form id="f"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Lozinka</label><input id="password" type="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Otvori admin panel →</button></form><div id="notice" class="notice"></div></section></main><script>f.onsubmit=async e=>{e.preventDefault();try{const d=await BA.signIn(email.value.trim(),password.value);const p=await BA.profile(d.user.id);if(p.role!=="admin"){await BA.client.auth.signOut();throw new Error("Ovaj nalog nema administratorski pristup.")}location.href="admin.html"}catch(err){BA.notice(err.message)}};</script></body></html>
