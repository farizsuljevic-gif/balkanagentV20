<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administracija — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="app.js"></script></head><body><main class="auth-page"><section class="auth-box glass"><a href="index.html"><img src="balkanagent-logo.jpg" alt="BalkanAgent"></a><h1>Administracija</h1><p class="muted">Prijava je namijenjena ovlašćenom administratoru.</p><form id="adminForm"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Lozinka</label><input id="password" type="password" required></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Otvori admin panel →</button></form><div id="notice" class="notice"></div></section></main><script>adminForm.onsubmit=e=>{e.preventDefault();try{BA.login(email.value,password.value,true);location.href="admin.html"}catch(err){BA.notice(err.message)}};</script></body></html>
