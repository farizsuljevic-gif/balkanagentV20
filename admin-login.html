<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Login — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="auth"><section class="authbox glass"><a href="index.html"><img src="logo.png" alt="BalkanAgent"></a><h1>Admin Login</h1><p class="muted">Authorized administrators only.</p><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" required></div><button class="btn primary" style="width:100%;margin-top:12px">Open Admin Panel</button></form><div id="notice" class="notice"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{const d=await BA.signin(email.value.trim(),password.value);const p=await BA.profile(d.user.id);if(p.role!=='admin'){await BA.client.auth.signOut();throw new Error('This account is not an administrator.')}location.href='admin.html'}catch(x){BA.notice(x.message)}};</script></body></html>
