<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin prijava — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="auth"><section class="box"><a class="wordmark" href="index.html"><span>BALKAN</span><strong>AGENT</strong><small>AI AUTOMATION FOR THE BALKANS</small></a><h1>Admin prijava</h1><form id="form"><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Lozinka</label><input id="password" type="password" required></div><button class="button primary" style="width:100%;margin-top:12px">Otvori admin panel</button></form><div id="notice" class="notice"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{const d=await BA.signIn(email.value.trim(),password.value);const p=await BA.getProfile(d.user.id);if(p.role!=='admin'){await BA.client.auth.signOut();throw new Error('Ovaj nalog nije administrator.')}location.href='admin.html'}catch(x){BA.notice(x.message)}};</script></body></html>
