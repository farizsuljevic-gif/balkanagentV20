<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Bots — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><div class="app"><aside class="side" id="side"><img src="logo.png" alt="BalkanAgent"><a href="dashboard.html" class="" data-i18n="dashboard">Dashboard</a><a href="bots.html" class="active" data-i18n="bots">Bots</a><a href="leads.html" class="" data-i18n="leads">Leads</a><a href="billing.html" class="" data-i18n="billing">Billing</a><a href="profile.html" class="" data-i18n="profile">Profile</a><a href="index.html">Public website</a><a href="#" id="logoutSide" data-i18n="logout">Log out</a></aside><main class="content"><header class="top"><div><button class="mobileapp btn" id="mobileMenu">☰</button><h1>My Bots</h1><p class="muted" id="welcome"></p></div><div><select data-lang-select><option value="me">🇲🇪 Crnogorski</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="ru">🇷🇺 Русский</option><option value="sq">🇦🇱 Shqip</option><option value="sl">🇸🇮 Slovenščina</option><option value="mk">🇲🇰 Македонски</option><option value="bg">🇧🇬 Български</option><option value="el">🇬🇷 Ελληνικά</option><option value="ro">🇷🇴 Română</option><option value="tr">🇹🇷 Türkçe</option></select> <button class="btn primary" id="logout" data-i18n="logout">Log out</button></div></header><section class="grid2"><article class="panel"><h2>Create / edit bot</h2><form id="botForm"><input id="botId" type="hidden"><div class="field"><label>Bot name</label><input id="botName" required placeholder="e.g. Hotel Assistant"></div><div class="field"><label>Website name</label><input id="businessName" required></div><div class="field"><label>Welcome message</label><textarea id="welcomeMessage" rows="3" required></textarea></div><div class="field"><label>Primary language</label><select id="botLanguage"><option>Crnogorski</option><option>English</option><option>Deutsch</option><option>Русский</option><option>Shqip</option></select></div><div class="field"><label>Brand color</label><input id="brandColor" type="color" value="#3976ff"></div><div class="field"><label>Contact email</label><input id="contactEmail" type="email"></div><h3>FAQ answers</h3><div id="faqList"></div><button class="btn" type="button" id="addFaq">+ Add FAQ</button><button class="btn primary" style="width:100%;margin-top:12px">Save Bot</button></form><div id="notice" class="notice"></div></article><article class="panel"><h2>Live preview</h2><div class="bot-preview"><div class="chatbox"><div class="chathead" id="previewHead">AI Assistant</div><div class="chatbody"><div class="bubble" id="previewWelcome">Hello! How can I help?</div><div class="bubble">Type a customer question…</div></div></div></div></article></section><section class="panel" style="margin-top:13px"><h2>My bots</h2><div id="botCards"></div></section></main></div><script>(async()=>{try{const auth=await BA.requireUser(false);if(!auth)return;window.currentAuth=auth;welcome.textContent=(auth.profile.full_name||auth.profile.email)+' · '+(auth.profile.company_name||'BalkanAgent');logout.onclick=BA.signout;logoutSide.onclick=e=>{e.preventDefault();BA.signout()};mobileMenu.onclick=()=>side.classList.toggle('open');
function faqRow(q='',a=''){const d=document.createElement('div');d.className='card';d.style.marginTop='8px';d.innerHTML=`<div class="field"><label>Question</label><input class="faqQ" value="${BA.esc(q)}"></div><div class="field"><label>Answer</label><textarea class="faqA">${BA.esc(a)}</textarea></div><button type="button" class="btn danger removeFaq">Remove</button>`;d.querySelector('.removeFaq').onclick=()=>d.remove();faqList.appendChild(d)}
addFaq.onclick=()=>faqRow();faqRow('What services do you offer?','We provide AI automation and website chatbot solutions.');
function preview(){previewHead.textContent=botName.value||'AI Assistant';previewHead.style.background=brandColor.value;previewWelcome.textContent=welcomeMessage.value||'Hello! How can I help?'}[botName,welcomeMessage,brandColor].forEach(x=>x.oninput=preview);
async function render(){const list=await BA.listBots();botCards.innerHTML=list.length?list.map(b=>`<div class="card" style="margin-top:8px"><h3>${BA.esc(b.name)}</h3><p>${BA.esc(b.business_name)} · ${BA.esc(b.language)}</p><div class="embed">&lt;script src="${location.origin}/widget.js" data-bot-id="${b.id}" async&gt;&lt;/script&gt;</div><p><button class="btn editBot" data-id="${b.id}">Edit</button> <button class="btn danger deleteBot" data-id="${b.id}">Delete</button></p></div>`).join(''):'<p class="muted">No bots yet.</p>';document.querySelectorAll('.deleteBot').forEach(x=>x.onclick=async()=>{if(confirm('Delete this bot?')){await BA.deleteBot(x.dataset.id);render()}});document.querySelectorAll('.editBot').forEach(x=>x.onclick=async()=>{const b=list.find(y=>y.id===x.dataset.id);botId.value=b.id;botName.value=b.name;businessName.value=b.business_name;welcomeMessage.value=b.welcome_message;botLanguage.value=b.language;brandColor.value=b.brand_color;contactEmail.value=b.contact_email||'';faqList.innerHTML='';(await BA.listFaqs(b.id)).forEach(f=>faqRow(f.question,f.answer));preview();scrollTo({top:0,behavior:'smooth'})})}
botForm.onsubmit=async e=>{e.preventDefault();try{const payload={name:botName.value.trim(),business_name:businessName.value.trim(),welcome_message:welcomeMessage.value.trim(),language:botLanguage.value,brand_color:brandColor.value,contact_email:contactEmail.value.trim(),status:'active'};let bot;if(botId.value)bot=await BA.updateBot(botId.value,payload);else bot=await BA.createBot(payload);const faqs=[...document.querySelectorAll('#faqList .card')].map(r=>({question:r.querySelector('.faqQ').value.trim(),answer:r.querySelector('.faqA').value.trim()})).filter(x=>x.question&&x.answer);await BA.saveFaqs(bot.id,faqs);BA.notice('Bot saved successfully.',true);botForm.reset();botId.value='';faqList.innerHTML='';faqRow();preview();render()}catch(x){BA.notice(x.message)}};render();preview();
}catch(x){alert(x.message);console.error(x)}})();</script></body></html>
