<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Razgovori — BalkanAgent</title><link rel="stylesheet" href="app-pages.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand">BA&nbsp; BALKAN<span>AGENT</span></div><div class="tagline">AI AUTOMATION PLATFORM</div><nav><a href="dashboard.html" class="">Pregled</a><a href="conversations.html" class="active">Razgovori</a><a href="bookings.html" class="">Rezervacije</a><a href="agents.html" class="">AI zaposleni</a><a href="billing.html" class="">Naplata</a><a href="profile.html" class="">Profil</a><a href="admin.html" class="admin-link" id="adminNav" style="display:none">Admin panel</a><a href="index.html">Javni sajt</a><a href="#" id="logoutLink">Odjava</a></nav></aside><main class="main"><header class="topbar"><div><button class="mobile-menu secondary" id="mobileMenu">☰</button><h1>Razgovori</h1><p class="muted" id="welcome"></p></div><div class="top-actions"><a class="btn secondary" href="index.html">Javni sajt</a><button id="logoutBtn">Odjava</button></div></header>
<section class="grid2"><article class="panel"><h2>Dodaj razgovor</h2><form id="itemForm" class="form-grid"><label>Kanal<select id="channel"><option>WhatsApp</option><option>Instagram</option><option>Messenger</option><option>Website</option><option>Viber</option></select></label><label>Klijent<input id="customer" required></label><label class="wide">Poruka<textarea id="message" required></textarea></label><button class="wide">Sačuvaj razgovor</button></form><div id="notice" class="notice"></div></article><article class="panel"><h2>Informacije</h2><p class="muted">Ovdje možete pregledati i testirati razgovore koji pripadaju vašem nalogu.</p></article></section><section class="panel" style="margin-top:12px"><h2>Svi razgovori</h2><div class="table-wrap"><table><thead><tr><th>Kanal</th><th>Klijent</th><th>Poruka</th><th>Vrijeme</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main></div><script>
const pageUser=BA.requireUser(false);
if(pageUser){
 document.getElementById("welcome").textContent=pageUser.name+" · "+pageUser.company;
 const adminNav=document.getElementById("adminNav");if(adminNav&&pageUser.role==="admin")adminNav.style.display="block";
}
document.getElementById("logoutBtn").onclick=BA.logout;
document.getElementById("logoutLink").onclick=function(e){e.preventDefault();BA.logout();};
document.getElementById("mobileMenu").onclick=function(){document.getElementById("sidebar").classList.toggle("open");};

function render(){const items=BA.ownerItems("conversations").slice().reverse();rows.innerHTML=items.map(x=>`<tr><td>${BA.escapeHtml(x.channel)}</td><td>${BA.escapeHtml(x.customer)}</td><td>${BA.escapeHtml(x.message)}</td><td>${BA.escapeHtml(x.created)}</td><td><button class="small-btn danger" data-remove="${x.id}">Obriši</button></td></tr>`).join("")||'<tr><td colspan="5" class="empty">Nema razgovora.</td></tr>';document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{BA.removeItem("conversations",b.dataset.remove);render();});}
itemForm.onsubmit=e=>{e.preventDefault();BA.addItem("conversations",{channel:channel.value,customer:customer.value,message:message.value,created:new Date().toLocaleString("en-GB")});itemForm.reset();BA.notice("Razgovor je sačuvan.",true);render();};render();

</script></body></html>
