<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversations — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><div class="app"><div id="side"></div><main class="main"><div class="eyebrow">CUSTOMER INBOX</div><h1 data-i18n="conversations">Conversations</h1><div id="list" class="list"></div></main></div><script src="/app.js"></script><script>side.innerHTML=BA.sidebar('conversations');(async()=>{const u=await BA.requireUser();if(u.is_admin)adminLink.hidden=false;const d=await BA.api('/api/conversations');list.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><div><strong>${x.customer_name}</strong><div class="muted">${x.channel} · ${x.agent_name||'Unassigned'}</div><div>${x.last_message||'No message preview'}</div></div><span class="pill">${x.status}</span></div>`).join(''):'<div class="card muted">No conversations yet.</div>'})()</script></body></html>
