<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Conversations — BalkanAgent</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span>BALKANAGENT</a></header><div class="app"><aside class="side"><a href="/dashboard.html">Overview</a><a href="/agents.html">AI Employees</a><a class="active" href="/conversations.html">Conversations</a><a href="/bookings.html">Bookings</a><a href="/profile.html">Company profile</a><a href="/billing.html">Billing</a></aside><main class="main"><div class="eyebrow">CUSTOMER INBOX</div><h1>Conversations</h1><div id="list" class="list"></div></main></div><script src="/app.js"></script><script>(async()=>{await BA.requireUser();const d=await BA.api('/api/conversations');list.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><div><strong>${x.customer_name}</strong><div class="muted">${x.channel} · ${x.agent_name||'Unassigned'}</div><div>${x.last_message||'No message preview'}</div></div><span>${x.status}</span></div>`).join(''):'<div class="card muted">No conversations yet. They will appear after a channel is connected.</div>'})()</script></body></html>
