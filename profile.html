<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company profile — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><div class="app"><div id="side"></div><main class="main"><div class="eyebrow">ACCOUNT SETTINGS</div><h1 data-i18n="profile">Company profile</h1><div id="notice" class="notice"></div><form id="profileForm" class="card form" style="max-width:680px"><input class="input" name="fullName" data-i18n-placeholder="fullName" placeholder="Full name"><input class="input" name="companyName" data-i18n-placeholder="companyName" placeholder="Company name"><input class="input" name="phone" data-i18n-placeholder="phone" placeholder="Phone"><input class="input" name="country" data-i18n-placeholder="country" placeholder="Country"><select class="input" name="preferredLanguage"><option value="en">English</option><option value="me">Crnogorski</option><option value="de">Deutsch</option><option value="sq">Shqip</option><option value="hr">Hrvatski</option><option value="sr">Srpski</option><option value="bs">Bosanski</option><option value="mk">Македонски</option><option value="sl">Slovenščina</option><option value="it">Italiano</option><option value="tr">Türkçe</option><option value="ru">Русский</option></select><button class="btn" data-i18n="save">Save</button></form></main></div><script src="/app.js"></script><script>side.innerHTML=BA.sidebar('profile');(async()=>{const d=await BA.api('/api/profile'),u=d.user;if(u.is_admin)adminLink.hidden=false;for(const [k,v] of Object.entries({fullName:u.full_name,companyName:u.company_name,phone:u.phone,country:u.country,preferredLanguage:u.preferred_language}))profileForm.elements[k].value=v||''})();profileForm.onsubmit=async e=>{e.preventDefault();try{await BA.api('/api/profile',{method:'PUT',body:JSON.stringify(Object.fromEntries(new FormData(profileForm)))});BA.msg('Profile saved successfully.','success')}catch(x){BA.msg(x.message)}}</script></body></html>
