<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil — BalkanAgent</title><link rel="stylesheet" href="app.css"><script src="app.js"></script></head><body><div class="app"><aside class="side" id="side"><a class="brand" href="index.html"><span class="mark">BA</span><span class="brand-copy"><b>BALKAN<span>AGENT</span></b><small>AI AUTOMATION PLATFORM</small></span></a><nav><a class="" href="dashboard.html">Pregled</a><a class="active" href="profile.html">Profil</a><a class="admin" href="admin.html">Admin panel</a><a href="index.html">Javni sajt</a><a href="#" id="logoutSide">Odjava</a></nav></aside><main class="content"><header class="top"><div><button class="menu-btn secondary" id="menuBtn">☰</button><h1>Profil</h1><p id="welcome" class="muted"></p></div><div><a class="btn secondary" href="index.html">Javni sajt</a> <button id="logout">Odjava</button></div></header><section class="grid2"><article class="panel"><h2>Podaci naloga</h2><form id="profileForm"><label>Ime<input id="name"></label><label>Firma<input id="company"></label><button class="full">Sačuvaj</button></form><div id="notice" class="notice"></div></article><article class="panel"><h2>Promjena lozinke</h2><form id="passForm"><label>Nova lozinka<input id="newPass" type="password" minlength="8"></label><button class="full">Promijeni lozinku</button></form></article></section></main></div><script>const user=BA.requireUser(false);if(user)welcome.textContent=user.name+" · "+(user.company||"BalkanAgent");logout.onclick=BA.logout;logoutSide.onclick=e=>{e.preventDefault();BA.logout()};menuBtn.onclick=()=>side.classList.toggle("open");if(user){name.value=user.name||"";company.value=user.company||""}profileForm.onsubmit=e=>{e.preventDefault();const list=BA.users();const u=list.find(x=>x.id===user.id);u.name=name.value;u.company=company.value;BA.write(BA.K.users,list);BA.setNotice("Profil je sačuvan.",true)};passForm.onsubmit=e=>{e.preventDefault();if(newPass.value.length<8){BA.setNotice("Lozinka mora imati najmanje 8 znakova.");return}const list=BA.users();const u=list.find(x=>x.id===user.id);u.password=newPass.value;BA.write(BA.K.users,list);newPass.value="";BA.setNotice("Lozinka je promijenjena.",true)};</script></body></html>
