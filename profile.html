<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil — BalkanAgent</title><link rel="stylesheet" href="app-pages.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand">BA&nbsp; BALKAN<span>AGENT</span></div><div class="tagline">AI AUTOMATION PLATFORM</div><nav><a href="dashboard.html" class="">Pregled</a><a href="conversations.html" class="">Razgovori</a><a href="bookings.html" class="">Rezervacije</a><a href="agents.html" class="">AI zaposleni</a><a href="billing.html" class="">Naplata</a><a href="profile.html" class="active">Profil</a><a href="admin.html" class="admin-link" id="adminNav" style="display:none">Admin panel</a><a href="index.html">Javni sajt</a><a href="#" id="logoutLink">Odjava</a></nav></aside><main class="main"><header class="topbar"><div><button class="mobile-menu secondary" id="mobileMenu">☰</button><h1>Profil</h1><p class="muted" id="welcome"></p></div><div class="top-actions"><a class="btn secondary" href="index.html">Javni sajt</a><button id="logoutBtn">Odjava</button></div></header>
<section class="grid2"><article class="panel"><h2>Podaci naloga</h2><form id="profileForm" class="form-grid"><label>Ime<input id="name"></label><label>Firma<input id="company"></label><label>Telefon<input id="phone"></label><label>Web-stranica<input id="website"></label><button class="wide">Sačuvaj profil</button></form><div id="notice" class="notice"></div></article><article class="panel"><h2>Promjena lozinke</h2><form id="passwordForm"><input id="newPassword" type="password" minlength="8" placeholder="Nova lozinka"><button class="full">Promijeni lozinku</button></form></article></section>
</main></div><script>
const pageUser=BA.requireUser(false);
if(pageUser){
 document.getElementById("welcome").textContent=pageUser.name+" · "+pageUser.company;
 const adminNav=document.getElementById("adminNav");if(adminNav&&pageUser.role==="admin")adminNav.style.display="block";
}
document.getElementById("logoutBtn").onclick=BA.logout;
document.getElementById("logoutLink").onclick=function(e){e.preventDefault();BA.logout();};
document.getElementById("mobileMenu").onclick=function(){document.getElementById("sidebar").classList.toggle("open");};

name.value=pageUser.name||"";company.value=pageUser.company||"";phone.value=pageUser.phone||"";website.value=pageUser.website||"";
profileForm.onsubmit=e=>{e.preventDefault();BA.updateProfile({name:name.value,company:company.value,phone:phone.value,website:website.value});BA.notice("Profil je sačuvan.",true);};
passwordForm.onsubmit=e=>{e.preventDefault();try{BA.changePassword(newPassword.value);newPassword.value="";BA.notice("Lozinka je promijenjena.",true);}catch(err){BA.notice(err.message,false);}};

</script></body></html>
