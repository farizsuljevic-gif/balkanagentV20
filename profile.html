<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Company profile — BalkanAgent</title><link rel="icon" href="/logo.svg"><link rel="stylesheet" href="/styles.css"></head><body><div class="app-shell"><aside class="sidebar"><a class="brand" href="/"><img src="/logo.svg"><div><b><span>BALKAN</span><span>AGENT</span></b><small>CONTROL CENTRE</small></div></a><nav class="side-nav">
<a data-page="dashboard" href="/dashboard.html">◫ Overview</a><a data-page="conversations" href="/conversations.html">◉ Conversations</a><a data-page="bookings" href="/bookings.html">◇ Bookings</a><a data-page="agents" href="/agents.html">✦ AI Employees</a><a data-page="profile" href="/profile.html">◌ Company profile</a><a data-page="billing" href="/billing.html">◈ Billing</a><a data-admin data-page="admin" href="/admin.html">⚙ Admin</a></nav><div class="side-bottom"><button class="btn ghost" style="width:100%" id="logoutBtn">Log out</button></div></aside><main class="main"><div class="topbar"><div><button class="btn ghost sm mobile-toggle" onclick="BA.toggleMenu()">☰</button><div class="eyebrow">BALKANAGENT</div><h2>Company profile</h2></div><div style="display:flex;align-items:center;gap:12px"><span id="userName" class="hide-mobile muted"></span><div class="avatar" id="avatar">BA</div></div></div><div id="notice" class="notice"></div><div class="card"><form id="profileForm" class="form"><label>Full name<input class="input" name="full_name" required></label><label>Company name<input class="input" name="company_name"></label><label>Phone<input class="input" name="phone"></label><label>Website<input class="input" name="website"></label><label>Business description<textarea class="input" name="business_description"></textarea></label><button class="btn">Save changes</button></form></div></main></div><script src="/app.js"></script><script>
(async()=>{const user=await BA.requireUser(false);if(!user)return;document.querySelector('[data-page="profile"]')?.classList.add("active");document.querySelectorAll("[data-admin]").forEach(x=>x.style.display=user.is_admin?"block":"none");userName.textContent=user.full_name||user.email;avatar.textContent=(user.full_name||"BA").split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();logoutBtn.onclick=async()=>{await BA.api("/api/auth/logout",{method:"POST"});location.href="/login.html"};const {profile}=await BA.api("/api/profile");Object.entries(profile||{}).forEach(([k,v])=>{if(profileForm.elements[k])profileForm.elements[k].value=v||""});profileForm.onsubmit=async e=>{e.preventDefault();await BA.api("/api/profile",{method:"PATCH",body:JSON.stringify(Object.fromEntries(new FormData(profileForm)))});BA.msg("Profile saved.","ok")};})().catch(e=>BA.msg(e.message));
</script></body></html>
