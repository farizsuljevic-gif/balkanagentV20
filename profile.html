<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="app.js"></script></head><body><div class="app-layout"><aside class="sidebar" id="sidebar"><img src="balkanagent-logo.jpg" alt="BalkanAgent"><a href="dashboard.html" class="">Pregled</a><a href="profile.html" class="active">Profil</a><a href="index.html">Javni sajt</a><a href="#" id="logoutSide">Odjava</a></aside><main class="app-content"><header class="app-topbar"><div><button class="mobile-app-menu btn btn-secondary" id="mobileMenu">☰</button><h1>Profil</h1><p class="muted" id="welcome"></p></div><div><a class="btn btn-secondary" href="index.html">Javni sajt</a> <button class="btn btn-primary" id="logout">Odjava</button></div></header><section class="app-grid"><article class="app-panel"><h2>Podaci naloga</h2><form id="profileForm"><div class="field"><label>Ime</label><input id="name"></div><div class="field"><label>Firma</label><input id="company"></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Sačuvaj profil</button></form><div id="notice" class="notice"></div></article><article class="app-panel"><h2>Promjena lozinke</h2><form id="passwordForm"><div class="field"><label>Nova lozinka</label><input id="newPassword" type="password" minlength="8"></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Promijeni lozinku</button></form></article></section></main></div><script>const user=BA.requireUser(false);if(user)welcome.textContent=user.name+" · "+(user.company||"BalkanAgent");logout.onclick=BA.logout;logoutSide.onclick=e=>{e.preventDefault();BA.logout()};mobileMenu.onclick=()=>sidebar.classList.toggle("open");if(user){name.value=user.name||"";company.value=user.company||""}profileForm.onsubmit=e=>{e.preventDefault();BA.update(user.id,{name:name.value,company:company.value});BA.notice("Profil je sačuvan.",true)};passwordForm.onsubmit=e=>{e.preventDefault();if(newPassword.value.length<8){BA.notice("Lozinka mora imati najmanje 8 znakova.");return}BA.update(user.id,{password:newPassword.value});newPassword.value="";BA.notice("Lozinka je promijenjena.",true)};</script></body></html>
