<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><div class="app-layout"><aside class="sidebar"><div class="brand">BALKAN<strong>AGENT</strong></div><a href="dashboard.html" class="" data-i18n="dashboard">Pregled</a><a href="profile.html" class="active" data-i18n="profile">Profil</a><a href="index.html">Javni sajt</a><a href="#" id="logoutSide" data-i18n="logout">Odjava</a></aside><main class="app-content"><header class="topbar"><div><h1>Profil</h1><p id="welcome" style="color:#a8b2c2"></p></div><div><select class="language-select" data-lang><option value="me">🇲🇪 Crnogorski</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="ru">🇷🇺 Русский</option></select> <button class="button primary" id="logout" data-i18n="logout">Odjava</button></div></header><section class="app-grid"><article class="app-card"><h2>Podaci profila</h2><form id="profileForm"><div class="field"><label>Ime i prezime</label><input id="name"></div><div class="field"><label>Firma</label><input id="company"></div><div class="field"><label>Telefon</label><input id="phone"></div><div class="field"><label>Država</label><input id="country"></div><button class="button primary" style="width:100%;margin-top:12px">Sačuvaj profil</button></form><div id="notice" class="notice"></div></article><article class="app-card"><h2>Promjena lozinke</h2><form id="passForm"><div class="field"><label>Nova lozinka</label><input id="newPass" type="password" minlength="8"></div><button class="button primary" style="width:100%;margin-top:12px">Promijeni lozinku</button></form></article></section></main></div><script>(async()=>{try{const auth=await BA.requireUser(false);if(!auth)return;welcome.textContent=(auth.profile.full_name||auth.profile.email)+' · '+(auth.profile.company_name||'BalkanAgent');logout.onclick=BA.signOut;logoutSide.onclick=e=>{e.preventDefault();BA.signOut()};name.value=auth.profile.full_name||'';company.value=auth.profile.company_name||'';phone.value=auth.profile.phone||'';country.value=auth.profile.country||'';profileForm.onsubmit=async e=>{e.preventDefault();try{await BA.updateProfile(auth.profile.id,{full_name:name.value.trim(),company_name:company.value.trim(),phone:phone.value.trim(),country:country.value.trim()});BA.notice('Profil je sačuvan.',true)}catch(x){BA.notice(x.message)}};passForm.onsubmit=async e=>{e.preventDefault();try{await BA.updatePassword(newPass.value);newPass.value='';BA.notice('Lozinka je promijenjena.',true)}catch(x){BA.notice(x.message)}};}catch(x){alert(x.message);console.error(x)}})();</script></body></html>
