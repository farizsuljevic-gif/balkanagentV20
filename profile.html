<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profile — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><div class="app"><aside class="side" id="side"><img src="logo.png" alt="BalkanAgent"><a href="dashboard.html" class="" data-i18n="dashboard">Dashboard</a><a href="bots.html" class="" data-i18n="bots">Bots</a><a href="leads.html" class="" data-i18n="leads">Leads</a><a href="billing.html" class="" data-i18n="billing">Billing</a><a href="profile.html" class="active" data-i18n="profile">Profile</a><a href="index.html">Public website</a><a href="#" id="logoutSide" data-i18n="logout">Log out</a></aside><main class="content"><header class="top"><div><button class="mobileapp btn" id="mobileMenu">☰</button><h1>Profile</h1><p class="muted" id="welcome"></p></div><div><select data-lang-select><option value="me">🇲🇪 Crnogorski</option><option value="en">🇬🇧 English</option><option value="de">🇩🇪 Deutsch</option><option value="ru">🇷🇺 Русский</option><option value="sq">🇦🇱 Shqip</option><option value="sl">🇸🇮 Slovenščina</option><option value="mk">🇲🇰 Македонски</option><option value="bg">🇧🇬 Български</option><option value="el">🇬🇷 Ελληνικά</option><option value="ro">🇷🇴 Română</option><option value="tr">🇹🇷 Türkçe</option></select> <button class="btn primary" id="logout" data-i18n="logout">Log out</button></div></header><section class="grid2"><article class="panel"><h2>Business profile</h2><form id="profileForm"><div class="field"><label>Full name</label><input id="name"></div><div class="field"><label>Company</label><input id="company"></div><div class="field"><label>Phone</label><input id="phone"></div><div class="field"><label>Country</label><input id="country"></div><button class="btn primary" style="width:100%;margin-top:12px">Save Profile</button></form><div id="notice" class="notice"></div></article><article class="panel"><h2>Password</h2><form id="passForm"><div class="field"><label>New password</label><input id="newPass" type="password" minlength="8"></div><button class="btn primary" style="width:100%;margin-top:12px">Change Password</button></form></article></section></main></div><script>(async()=>{try{const auth=await BA.requireUser(false);if(!auth)return;window.currentAuth=auth;welcome.textContent=(auth.profile.full_name||auth.profile.email)+' · '+(auth.profile.company_name||'BalkanAgent');logout.onclick=BA.signout;logoutSide.onclick=e=>{e.preventDefault();BA.signout()};mobileMenu.onclick=()=>side.classList.toggle('open');name.value=auth.profile.full_name||'';company.value=auth.profile.company_name||'';phone.value=auth.profile.phone||'';country.value=auth.profile.country||'';profileForm.onsubmit=async e=>{e.preventDefault();try{await BA.updateProfile(auth.profile.id,{full_name:name.value.trim(),company_name:company.value.trim(),phone:phone.value.trim(),country:country.value.trim()});BA.notice('Profile saved.',true)}catch(x){BA.notice(x.message)}};passForm.onsubmit=async e=>{e.preventDefault();try{await BA.updatePassword(newPass.value);newPass.value='';BA.notice('Password changed.',true)}catch(x){BA.notice(x.message)}};}catch(x){alert(x.message);console.error(x)}})();</script></body></html>
