<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Profil — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-app.js"></script></head><body><div class="app-layout"><aside class="sidebar" id="sidebar"><img src="balkanagent-logo.jpg" alt="BalkanAgent"><a href="dashboard.html" class="">Pregled</a><a href="profile.html" class="active">Profil</a><a href="index.html">Javni sajt</a><a href="#" id="logoutSide">Odjava</a></aside><main class="app-content"><header class="app-topbar"><div><button class="mobile-app-menu btn btn-secondary" id="mobileMenu">☰</button><h1>Profil</h1><p class="muted" id="welcome"></p></div><div><a class="btn btn-secondary" href="index.html">Javni sajt</a> <button class="btn btn-primary" id="logout">Odjava</button></div></header><section class="app-grid"><article class="app-panel"><h2>Podaci naloga</h2><form id="pf"><div class="field"><label>Ime</label><input id="name"></div><div class="field"><label>Firma</label><input id="company"></div><div class="field"><label>Telefon</label><input id="phone"></div><div class="field"><label>Država</label><input id="country"></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Sačuvaj profil</button></form><div id="notice" class="notice"></div></article><article class="app-panel"><h2>Promjena lozinke</h2><form id="pw"><div class="field"><label>Nova lozinka</label><input id="newPassword" type="password" minlength="8"></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Promijeni lozinku</button></form></article></section></main></div><script>(async()=>{try{const a=await BA.requireUser(false);if(!a)return;const user=a.profile;welcome.textContent=(user.full_name||user.email)+" · "+(user.company_name||"BalkanAgent");logout.onclick=BA.signOut;logoutSide.onclick=e=>{e.preventDefault();BA.signOut()};mobileMenu.onclick=()=>sidebar.classList.toggle("open");name.value=user.full_name||"";company.value=user.company_name||"";phone.value=user.phone||"";country.value=user.country||"";pf.onsubmit=async e=>{e.preventDefault();try{await BA.updateProfile(user.id,{full_name:name.value.trim(),company_name:company.value.trim(),phone:phone.value.trim(),country:country.value.trim()});BA.notice("Profil je sačuvan.",true)}catch(err){BA.notice(err.message)}};pw.onsubmit=async e=>{e.preventDefault();try{await BA.updatePassword(newPassword.value);newPassword.value="";BA.notice("Lozinka je promijenjena.",true)}catch(err){BA.notice(err.message)}};}catch(err){alert("Greška: "+err.message)}})();</script></body></html>
