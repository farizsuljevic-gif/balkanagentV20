<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Password</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="auth"><section class="authbox glass"><a href="index.html"><img src="logo.png"></a><h1>New Password</h1><form id="form"><div class="field"><label>New password</label><input id="password" type="password" minlength="8" required></div><button class="btn primary" style="width:100%;margin-top:12px">Save Password</button></form><div id="notice" class="notice"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{await BA.updatePassword(password.value);BA.notice('Password changed.',true);setTimeout(()=>location.href='login.html',1000)}catch(x){BA.notice(x.message)}};</script></body></html>
