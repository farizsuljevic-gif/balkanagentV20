<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings — BalkanAgent</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span>BALKANAGENT</a></header><div class="app"><aside class="side"><a href="/dashboard.html">Overview</a><a href="/agents.html">AI Employees</a><a href="/conversations.html">Conversations</a><a class="active" href="/bookings.html">Bookings</a><a href="/profile.html">Company profile</a><a href="/billing.html">Billing</a></aside><main class="main"><div class="topbar"><div><div class="eyebrow">RESERVATIONS</div><h1>Bookings</h1></div><button class="btn" onclick="modal.classList.add('open')">Add booking</button></div><div id="list" class="list"></div></main></div><div id="modal" class="modal"><form id="bookingForm" class="card form"><h2>Add booking</h2><input class="input" name="customerName" placeholder="Customer name" required><input class="input" type="email" name="customerEmail" placeholder="Customer email"><input class="input" name="service" placeholder="Service / room / appointment" required><input class="input" type="datetime-local" name="bookingDate" required><textarea class="input" name="notes" placeholder="Notes"></textarea><button class="btn">Save</button><button type="button" class="btn ghost" onclick="modal.classList.remove('open')">Cancel</button></form></div><script src="/app.js"></script><script>async function load(){await BA.requireUser();const d=await BA.api('/api/bookings');list.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><div><strong>${x.customer_name}</strong><div class="muted">${x.service} · ${new Date(x.booking_date).toLocaleString()}</div></div><span>${x.status}</span></div>`).join(''):'<div class="card muted">No bookings yet.</div>'}bookingForm.onsubmit=async e=>{e.preventDefault();await BA.api('/api/bookings',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(bookingForm)))});modal.classList.remove('open');bookingForm.reset();load()};load()</script></body></html>
