<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rezervacije — BalkanAgent</title><link rel="stylesheet" href="app-pages.css"><script src="app.js"></script></head><body><div class="app"><aside class="sidebar" id="sidebar"><div class="brand">BA&nbsp; BALKAN<span>AGENT</span></div><div class="tagline">AI AUTOMATION PLATFORM</div><nav><a href="dashboard.html" class="">Pregled</a><a href="conversations.html" class="">Razgovori</a><a href="bookings.html" class="active">Rezervacije</a><a href="agents.html" class="">AI zaposleni</a><a href="billing.html" class="">Naplata</a><a href="profile.html" class="">Profil</a><a href="admin.html" class="admin-link" id="adminNav" style="display:none">Admin panel</a><a href="index.html">Javni sajt</a><a href="#" id="logoutLink">Odjava</a></nav></aside><main class="main"><header class="topbar"><div><button class="mobile-menu secondary" id="mobileMenu">☰</button><h1>Rezervacije</h1><p class="muted" id="welcome"></p></div><div class="top-actions"><a class="btn secondary" href="index.html">Javni sajt</a><button id="logoutBtn">Odjava</button></div></header>
<section class="grid2"><article class="panel"><h2>Nova rezervacija</h2><form id="itemForm" class="form-grid"><label>Klijent<input id="customer" required></label><label>Usluga<input id="service" required></label><label>Datum<input id="date" type="date" required></label><label>Vrijeme<input id="time" type="time" required></label><label>Status<select id="status"><option value="confirmed">Potvrđena</option><option value="pending">Na čekanju</option><option value="cancelled">Otkazana</option></select></label><button>Sačuvaj</button></form><div id="notice" class="notice"></div></article><article class="panel"><h2>Kalendar</h2><p class="muted">Rezervacije se čuvaju u ovom pregledaču i pojavljuju se u dashboardu.</p></article></section><section class="panel" style="margin-top:12px"><h2>Rezervacije</h2><div class="table-wrap"><table><thead><tr><th>Klijent</th><th>Usluga</th><th>Datum</th><th>Vrijeme</th><th>Status</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main></div><script>
const pageUser=BA.requireUser(false);
if(pageUser){
 document.getElementById("welcome").textContent=pageUser.name+" · "+pageUser.company;
 const adminNav=document.getElementById("adminNav");if(adminNav&&pageUser.role==="admin")adminNav.style.display="block";
}
document.getElementById("logoutBtn").onclick=BA.logout;
document.getElementById("logoutLink").onclick=function(e){e.preventDefault();BA.logout();};
document.getElementById("mobileMenu").onclick=function(){document.getElementById("sidebar").classList.toggle("open");};

function render(){const items=BA.ownerItems("bookings").slice().reverse();rows.innerHTML=items.map(x=>`<tr><td>${BA.escapeHtml(x.customer)}</td><td>${BA.escapeHtml(x.service)}</td><td>${BA.escapeHtml(x.date)}</td><td>${BA.escapeHtml(x.time)}</td><td><span class="status ${x.status==="pending"?"pending":""}">${BA.escapeHtml(x.status)}</span></td><td><button class="small-btn danger" data-remove="${x.id}">Obriši</button></td></tr>`).join("")||'<tr><td colspan="6" class="empty">Nema rezervacija.</td></tr>';document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{BA.removeItem("bookings",b.dataset.remove);render();});}
itemForm.onsubmit=e=>{e.preventDefault();BA.addItem("bookings",{customer:customer.value,service:service.value,date:date.value,time:time.value,status:status.value});itemForm.reset();BA.notice("Rezervacija je sačuvana.",true);render();};render();

</script></body></html>
