<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bookings — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><div class="app"><div id="side"></div><main class="main"><div class="topbar"><div><div class="eyebrow">RESERVATIONS</div><h1 data-i18n="bookings">Bookings</h1></div><button class="btn" onclick="modal.classList.add('open')" data-i18n="addBooking">Add booking</button></div><div id="list" class="list"></div></main></div><div id="modal" class="modal"><form id="bookingForm" class="card form"><h2 data-i18n="addBooking">Add booking</h2><input class="input" name="customerName" data-i18n-placeholder="customer" placeholder="Customer name" required><input class="input" type="email" name="customerEmail" data-i18n-placeholder="email" placeholder="Email"><input class="input" name="service" data-i18n-placeholder="service" placeholder="Service / room / appointment" required><input class="input" type="datetime-local" name="bookingDate" required><textarea class="input" name="notes" data-i18n-placeholder="notes" placeholder="Notes"></textarea><button class="btn" data-i18n="save">Save</button><button type="button" class="btn ghost" onclick="modal.classList.remove('open')" data-i18n="cancel">Cancel</button></form></div><script src="/app.js"></script><script>side.innerHTML=BA.sidebar('bookings');async function load(){const u=await BA.requireUser();if(u.is_admin)adminLink.hidden=false;const d=await BA.api('/api/bookings');list.innerHTML=d.items.length?d.items.map(x=>`<div class="row"><div><strong>${x.customer_name}</strong><div class="muted">${x.service} · ${new Date(x.booking_date).toLocaleString()}</div></div><span class="pill">${x.status}</span></div>`).join(''):'<div class="card muted">No bookings yet.</div>'}bookingForm.onsubmit=async e=>{e.preventDefault();await BA.api('/api/bookings',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(bookingForm)))});modal.classList.remove('open');bookingForm.reset();load()};load()</script></body></html>
