<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>BalkanAgent</title><link rel='stylesheet' href='styles.css'><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="app.js"></script></head><body>
<div class='stage'>
<img class='top-logo' src='logo.png' alt='BalkanAgent'>
<a class='hot trialBtn' href='register.html' aria-label='Start free trial'></a><button class='hot demoBtn' id='demoBtn' aria-label='Book a demo'></button><a class='hot loginBtn' href='login.html'></a><a class='hot startTop' href='register.html'></a><a class='hot pricing1' href='register.html'></a><a class='hot pricing2' href='register.html'></a><a class='hot pricing3' href='register.html'></a><button class='hot videoTrigger' id='videoBtn'></button>
</div>
<section class='mobile'><img src='logo.png'><h1>The AI Platform Built for the Balkans.</h1><p>Automate conversations, bookings and customer support. Save time, close more deals and grow faster.</p><a class='btn' href='register.html'>Start Free Trial</a><button class='btn' id='mobileVideo'>Watch Demo</button><img class='mapshot' src='reference-layout.jpg'></section>
<div class='modal' id='modal'><div class='modalbox'><button class='close' id='close'>×</button><video controls playsinline preload='metadata'><source src='balkanagent-demo.mp4' type='video/mp4'></video></div></div>
<script>const m=document.getElementById('modal');['demoBtn','videoBtn','mobileVideo'].forEach(id=>{const e=document.getElementById(id);if(e)e.onclick=()=>m.classList.add('open')});document.getElementById('close').onclick=()=>m.classList.remove('open');m.onclick=e=>{if(e.target===m)m.classList.remove('open')}</script></body></html>
