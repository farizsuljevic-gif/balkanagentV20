<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create account — BalkanAgent</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span>BALKANAGENT</a></header><main class="shell"><section class="auth card"><div class="eyebrow">CREATE ACCOUNT</div><h1>Start your workspace</h1><div id="notice" class="notice"></div><form id="form" class="form"><input class="input" name="fullName" placeholder="Full name" required><input class="input" name="companyName" placeholder="Company name"><input class="input" type="email" name="email" placeholder="Email" required><input class="input" type="password" name="password" minlength="8" placeholder="Password (minimum 8 characters)" required><button class="btn">Create account</button></form><p class="muted">Already registered? <a href="/login.html">Log in</a></p></section></main><script src="/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(form));try{await BA.api('/api/auth/register',{method:'POST',body:JSON.stringify(b)});location.href='/dashboard.html'}catch(x){BA.msg(x.message)}}</script></body></html>
