<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registracija — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="auth"><section class="box"><a class="wordmark" href="index.html"><span>BALKAN</span><strong>AGENT</strong><small>AI AUTOMATION FOR THE BALKANS</small></a><h1>Registracija</h1><form id="form"><div class="field"><label>Ime i prezime</label><input id="name" required></div><div class="field"><label>Firma</label><input id="company"></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Lozinka</label><input id="password" type="password" minlength="8" required></div><button class="button primary" style="width:100%;margin-top:12px">Kreiraj nalog</button></form><p><a href="login.html">Već imate nalog? Prijavite se</a></p><div id="notice" class="notice"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{const d=await BA.signUp(name.value.trim(),company.value.trim(),email.value.trim(),password.value);if(d.session)location.href='dashboard.html';else{BA.notice('Nalog je kreiran. Provjerite email.',true);form.reset()}}catch(x){BA.notice(x.message)}};</script></body></html>
