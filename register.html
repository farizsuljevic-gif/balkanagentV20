<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register — BalkanAgent V3</title><link rel="stylesheet" href="/styles.css"></head><body><header class="header"><a class="brand" href="/"><span class="mark">BA</span><span>BALKAN<span class="accent">AGENT</span> <small>V3 ENTERPRISE</small></span></a><div class="header-end"></div></header><main class="shell"><section class="auth card"><div class="eyebrow">BALKANAGENT V3 ENTERPRISE</div><h1 data-i18n="register">Create account</h1><div id="notice" class="notice"></div><form id="form" class="form"><input class="input" name="fullName" data-i18n-placeholder="fullName" placeholder="Full name" required><input class="input" name="companyName" data-i18n-placeholder="companyName" placeholder="Company name"><input class="input" type="email" name="email" data-i18n-placeholder="email" placeholder="Email" required><input class="input" type="password" name="password" minlength="10" placeholder="Password: 10+ chars, upper/lowercase and number" required><select class="input" name="preferredLanguage"><option value="en">English</option><option value="me">Crnogorski</option><option value="de">Deutsch</option><option value="sq">Shqip</option><option value="hr">Hrvatski</option><option value="sr">Srpski</option><option value="bs">Bosanski</option><option value="mk">Македонски</option><option value="sl">Slovenščina</option><option value="it">Italiano</option><option value="tr">Türkçe</option><option value="ru">Русский</option></select><button class="btn" data-i18n="register">Create account</button></form><p class="muted">Already registered? <a href="/login.html" data-i18n="login">Log in</a></p></section></main><script src="/app.js"></script><script>form.onsubmit=async e=>{e.preventDefault();try{await BA.api('/api/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});location.href='/dashboard.html'}catch(x){BA.msg(x.message)}}</script></body></html>
