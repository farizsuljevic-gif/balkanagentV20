<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registracija — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="app.js"></script></head><body><main class="auth-page"><section class="auth-box glass"><a href="index.html"><img src="balkanagent-logo.jpg" alt="BalkanAgent"></a><h1>Započni besplatno</h1><p class="muted">Kreirajte svoj BalkanAgent nalog.</p><form id="registerForm"><div class="field"><label>Ime i prezime</label><input id="name" required></div><div class="field"><label>Naziv firme</label><input id="company"></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Lozinka</label><input id="password" type="password" minlength="8" required></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Kreiraj nalog →</button></form><div id="notice" class="notice"></div><p class="muted">Već imate nalog? <a href="login.html">Prijavite se</a></p></section></main><script>registerForm.onsubmit=e=>{e.preventDefault();try{BA.register({name:name.value,company:company.value,email:email.value,password:password.value});location.href="dashboard.html"}catch(err){BA.notice(err.message)}};</script></body></html>
