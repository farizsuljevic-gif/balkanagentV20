<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registracija — BalkanAgent</title><link rel="stylesheet" href="app.css"><script src="app.js"></script></head><body><main class="auth"><section class="auth-card"><a class="brand" href="index.html"><span class="mark">BA</span><span class="brand-copy"><b>BALKAN<span>AGENT</span></b><small>AI AUTOMATION PLATFORM</small></span></a><h1>Započni besplatno</h1><p class="muted">Kreirajte svoj BalkanAgent nalog.</p><form id="form"><label>Ime i prezime<input id="name" required></label><label>Naziv firme<input id="company"></label><label>Email<input id="email" type="email" required></label><label>Lozinka<input id="password" type="password" minlength="8" required></label><button class="full">Kreiraj nalog →</button></form><div id="notice" class="notice"></div><p class="muted">Već imate nalog? <a href="login.html">Prijavite se</a></p></section></main><script>
form.onsubmit=e=>{e.preventDefault();try{BA.register({name:name.value,company:company.value,email:email.value,password:password.value});location.href="dashboard.html"}catch(err){BA.setNotice(err.message)}};
</script></body></html>
