<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Create Account — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="i18n.js"></script><script src="app.js"></script></head><body><main class="auth"><section class="authbox glass"><a href="index.html"><img src="logo.png" alt="BalkanAgent"></a><h1>Create Account</h1><p class="muted">Create your BalkanAgent test account.</p><form id="form"><div class="field"><label>Full name</label><input id="name" required></div><div class="field"><label>Company</label><input id="company"></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Password</label><input id="password" type="password" minlength="8" required></div><button class="btn primary" style="width:100%;margin-top:12px">Create Account</button></form><p class="muted">Already registered? <a href="login.html">Log in</a></p><div id="notice" class="notice"></div></section></main><script>form.onsubmit=async e=>{e.preventDefault();try{const d=await BA.signup({fullName:name.value.trim(),companyName:company.value.trim(),email:email.value.trim(),password:password.value});if(d.session)location.href='dashboard.html';else{BA.notice('Account created. Check your email to confirm registration.',true);form.reset()}}catch(x){BA.notice(x.message)}};</script></body></html>
