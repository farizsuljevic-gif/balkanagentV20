<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Započni besplatno — BalkanAgent</title><link rel="stylesheet" href="styles.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="supabase-app.js"></script></head><body><main class="auth-page"><section class="auth-box glass"><a href="index.html"><img src="balkanagent-logo.jpg" alt="BalkanAgent"></a><h1>Započni besplatno</h1><p class="muted">Kreirajte svoj BalkanAgent testni nalog.</p><form id="f"><div class="field"><label>Ime i prezime</label><input id="name" required></div><div class="field"><label>Naziv firme</label><input id="company"></div><div class="field"><label>Email</label><input id="email" type="email" required></div><div class="field"><label>Lozinka</label><input id="password" type="password" minlength="8" required></div><button class="btn btn-primary" style="width:100%;margin-top:12px">Kreiraj nalog →</button></form><p class="muted">Već imate nalog? <a href="login.html">Prijavite se</a></p><div id="notice" class="notice"></div></section></main><script>f.onsubmit=async e=>{e.preventDefault();try{const d=await BA.signUp({fullName:name.value.trim(),companyName:company.value.trim(),email:email.value.trim(),password:password.value});if(d.session)location.href="dashboard.html";else{BA.notice("Nalog je kreiran. Provjerite email i potvrdite registraciju.",true);f.reset()}}catch(err){BA.notice(err.message)}};</script></body></html>
