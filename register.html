<!doctype html><html lang="me"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Registracija — BalkanAgent</title><link rel="stylesheet" href="app-pages.css"><script src="app.js"></script></head><body><main class="auth-wrap"><section class="auth-card"><a class="back" href="index.html">← Početna</a><div class="brand">BA&nbsp; BALKAN<span>AGENT</span></div><div class="tagline">AI AUTOMATION PLATFORM</div><h1>Započni besplatno</h1><p class="muted">Kreirajte BalkanAgent nalog.</p><form id="registerForm"><label>Ime i prezime<input id="name" required></label><label>Naziv firme<input id="company"></label><label>Email<input id="email" type="email" required></label><label>Lozinka<input id="password" type="password" minlength="8" required></label><button class="full" type="submit">Kreiraj nalog →</button></form><div id="notice" class="notice"></div><p class="muted">Već imate nalog? <a href="login.html">Prijavite se</a></p></section></main><script>
document.getElementById("registerForm").addEventListener("submit",function(e){
 e.preventDefault();
 try {
  BA.register({name:name.value,company:company.value,email:email.value,password:password.value});
  location.href="dashboard.html";
 } catch(err) { BA.notice(err.message,false); }
});
</script></body></html>
